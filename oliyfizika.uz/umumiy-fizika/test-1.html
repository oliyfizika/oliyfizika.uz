<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1-Mavzu Testi | OliyFizika.uz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#020817;
  color:white;
  padding:36px 20px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%),
    linear-gradient(135deg,#020817,#07122f,#020817);
  z-index:-1;
}

.quiz-container{
  width:100%;
  max-width:980px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:36px;
}

.back-link{
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

h1{
  font-size:44px;
  line-height:1.2;
}

.subtitle{
  color:#cbd5e1;
  margin-top:10px;
}

.question{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  padding:28px;
  border-radius:24px;
  margin-bottom:24px;
}

.question h2{
  margin-bottom:18px;
  font-size:22px;
  line-height:1.6;
}

.answers{
  display:grid;
  gap:12px;
}

.answer-option{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:15px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid transparent;
  cursor:pointer;
  transition:.2s;
}

.answer-option:hover{
  background:rgba(37,99,235,.22);
}

.answer-option.correct{
  border-color:#22c55e;
  background:rgba(34,197,94,.18);
}

.answer-option.wrong{
  border-color:#ef4444;
  background:rgba(239,68,68,.18);
}

.submit-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.result{
  margin-top:28px;
  padding:22px;
  border-radius:20px;
  text-align:center;
  font-size:24px;
  font-weight:700;
  background:rgba(255,255,255,.05);
}

.result:empty{
  display:none;
}

.result.success{
  color:#86efac;
}

.result.error{
  color:#fca5a5;
}

@media(max-width:720px){
  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  h1{
    font-size:34px;
  }
}
</style>
</head>

<body>
<main class="quiz-container">
  <div class="topbar">
    <div>
      <h1>1-Mavzu | Mexanik harakat testi</h1>
      <p class="subtitle">Kamida 80% natija 2-darsni ochadi.</p>
    </div>
    <a href="mexanika.html" class="back-link">Orqaga</a>
  </div>

  <div id="questions"></div>
  <button type="button" class="submit-btn" id="submitBtn">Testni yakunlash</button>
  <div class="result" id="result"></div>
</main>

<script type="module">
import { renderMultipleChoiceTest } from "../js/multiple-choice-test.js";

const questions = [
  {
    text: "Mexanik harakat deb nimaga aytiladi?",
    answers: [
      "Jism massasining o‘zgarishiga",
      "Jismning boshqa jismlarga nisbatan o‘rnining vaqt davomida o‘zgarishiga",
      "Jismning rang o‘zgarishiga",
      "Jismning hajm o‘zgarishiga"
    ],
    correct: 1
  },
  {
    text: "Trayektoriya nima?",
    answers: [
      "Jismning massasi",
      "Jismning tezligi",
      "Jism harakat davomida chizgan izi",
      "Jismning hajmi"
    ],
    correct: 2
  },
  {
    text: "Tezlik formulasi qaysi javobda to‘g‘ri berilgan?",
    answers: ["v = s · t", "v = t/s", "v = s/t", "v = s + t"],
    correct: 2
  },
  {
    text: "Xalqaro birliklar sistemasida tezlik birligi qaysi?",
    answers: ["m", "s", "m/s", "N"],
    correct: 2
  },
  {
    text: "Jism 120 m masofani 20 s da bosib o‘tdi. Uning tezligini toping.",
    answers: ["4 m/s", "5 m/s", "6 m/s", "8 m/s"],
    correct: 2
  },
  {
    text: "Tekis harakat deb qanday harakatga aytiladi?",
    answers: [
      "Tezligi o‘zgaradigan harakatga",
      "Trayektoriyasi egri chiziqli bo‘lgan harakatga",
      "Teng vaqt oralig‘ida teng masofa bosib o‘tiladigan harakatga",
      "Faqat vertikal harakatga"
    ],
    correct: 2
  },
  {
    text: "Jismning bosib o‘tgan yo‘li qanday harf bilan belgilanadi?",
    answers: ["t", "m", "s", "v"],
    correct: 2
  },
  {
    text: "Vaqtning SI dagi birligi qaysi?",
    answers: ["minut", "soat", "sekund", "sutka"],
    correct: 2
  },
  {
    text: "Agar jism tezligi ortib borsa, bu qanday harakat deyiladi?",
    answers: ["Tekis harakat", "Notekis harakat", "Tinch holat", "Aylana harakat"],
    correct: 1
  },
  {
    text: "Yo‘l formulasi qaysi javobda to‘g‘ri ko‘rsatilgan?",
    answers: ["s = vt", "s = v/t", "s = t/v", "s = v + t"],
    correct: 0
  }
];

renderMultipleChoiceTest({
  questions,
  form: document.getElementById("questions"),
  result: document.getElementById("result"),
  submitButton: document.getElementById("submitBtn"),
  unlockLesson: 2
});
</script>
</body>
</html>
