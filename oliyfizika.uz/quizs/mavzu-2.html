<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 2 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

</style>
</head>

<body>

<div class="quiz-box">

<h1>
QUIZ: 🚀 To'g'ri chiziqli o'zgaruvchan harakat
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"To'g'ri chiziqli tekis o'zgaruvchan harakatda tezlik qanday o'zgaradi?",
a:["O'zgarmaydi","Teng vaqtlar ichida bir xil miqdorda","Faqat ortadi","Faqat kamayadi"],
c:1
},

{
q:"Tezlanish deb nimaga aytiladi?",
a:["Bosib o'tilgan yo'lga","Vaqt birligi ichidagi tezlik o'zgarishiga","Harakat traektoriyasiga","Kuchning massaga ko'paytmasiga"],
c:1
},

{
q:"Tezlanishning XBS dagi birligi qanday?",
a:["m/s","m/s²","m","km/soat"],
c:1
},

{
q:"Tekis tezlanuvchan harakatda tezlik va tezlanish vektorlari yo'nalishi qanday bo'ladi?",
a:["Qarama-qarshi","O'zaro perpendikulyar","Bir tomonga yo'nalgan","Burchak ostida"],
c:2
},

{
q:"Tekis sekinlanuvchan harakatda tezlik va tezlanish vektorlari qanday yo'naladi?",
a:["Bir tomonga","Qarama-qarshi tomonga","Parallel","Yo'nalishga ega emas"],
c:1
},

{
q:"Tekis o'zgaruvchan harakatda v(t) tezlik grafigi qanday chiziqdan iborat?",
a:["Parabola","Giperbola","To'g'ri chiziq","Egri chiziq"],
c:2
},

{
q:"Tekis o'zgaruvchan harakatda yo'l (ko'chish) grafigi qanday shaklda bo'ladi?",
a:["To'g'ri chiziq","Aylana yoyi","Parabola","Gorizontal chiziq"],
c:2
},

{
q:"Tekis o'zgaruvchan harakatda o'rtacha tezlik qanday topiladi?",
a:["v_o'r = (v + v0) / 2","v_o'r = v - v0","v_o'r = v * t","v_o'r = S / t²"],
c:0
},

{
q:"Erkin tushish tezlanishi (g) ning o'rtacha qiymati qancha?",
a:["100 m/s²","9,8 m/s²","5,5 m/s²","0 m/s²"],
c:1
},

{
q:"Erkin tushayotgan jism qanday harakat qiladi?",
a:["Tekis harakat","Tekis sekinlanuvchan","Tekis tezlanuvchan","Egri chiziqli"],
c:2
},

{
q:"Yuqoriga tik otilgan jismning ko'tarilishdagi harakati qanday turga kiradi?",
a:["Tekis tezlanuvchan","Tekis sekinlanuvchan","Notekis o'zgaruvchan","Aylanma"],
c:1
},

{
q:"Tezlanishni o'lchaydigan asbob nima deb ataladi?",
a:["Spidometr","Sekundomer","Akselerometr","Dinamometr"],
c:2
},

{
q:"Jismning tinch holatidan boshlab (v0=0) tekis tezlanuvchan harakatidagi yo'l formulasi qanday?",
a:["S = at²/2","S = vt","S = gt","S = v²/2"],
c:0
},

{
q:"Erkin tushayotgan jismning tushish vaqti (t) qaysi formula bilan aniqlanadi?",
a:["t = v/g","t = √(2h/g)","t = h/g","t = √(h/2g)"],
c:1
},

{
q:"Jism qanday holatda tezlanishga ega bo'lmaydi?",
a:["Erkin tushayotganida","Tinch holatda va tekis harakatda","Aylana bo'ylab harakatda","Yuqoriga otilganida"],
c:1
},

{
q:"Oniy tezlik deb nimaga aytiladi?",
a:["Jami yo'lning vaqtga nisbatiga","Eng katta tezlikka","Berilgan vaqt momentidagi tezlikka","Boshlang'ich tezlikka"],
c:2
},

{
q:"Tekis tezlanuvchan harakatda tezlik formulasi qanday?",
a:["v = v0 + at","v = v0 - at","v = at²/2","v = v0 * t"],
c:0
},

{
q:"Erkin tushish tezlanishi yerning qaysi qismida eng katta qiymatga ega?",
a:["Ekvatorda","Qutblarda","Tog' tepasida","Dengiz sathida"],
c:1
},

{
q:"Tekis sekinlanuvchan harakatda tezlik vaqti o'tishi bilan qanday o'zgaradi?",
a:["Ortadi","Kamayadi","O'zgarmaydi","Avval ortib, so'ng kamayadi"],
c:1
},

{
q:"Agar jismning tezlik va tezlanish vektorlari o'zaro to'g'ri burchak (90°) hosil qilsa, u qanday harakat qiladi?",
a:["Tekis tezlanuvchan","Aylana bo'ylab tekis harakat","Tekis sekinlanuvchan","To'g'ri chiziqli tekis harakat"],
c:1
}
]

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();



</script>

</body>
</html>
