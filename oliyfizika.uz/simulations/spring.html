
<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Spring Oscillator | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  margin-bottom:35px;

  font-size:30px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:10px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.start-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.start-btn:hover{

  transform:translateY(-3px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}


/* RESPONSIVE */

@media(max-width:1000px){

  .main{

    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="simulations.html"
class="back-btn">

🧪 Simulyatorlar

</a>

</nav>



<!-- MAIN -->

<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
🌀 Spring Oscillator
</h2>



<div class="control-group">

<label>
Massa (kg)
</label>

<input
type="range"
id="mass"
min="1"
max="20"
value="5">

<div
class="value"
id="massValue">

5 kg

</div>

</div>



<div class="control-group">

<label>
Prujina qattiqligi (k)
</label>

<input
type="range"
id="k"
min="1"
max="50"
value="10">

<div
class="value"
id="kValue">

10 N/m

</div>

</div>



<div class="control-group">

<label>
Amplitude
</label>

<input
type="range"
id="amplitude"
min="20"
max="200"
value="100">

<div
class="value"
id="amplitudeValue">

100

</div>

</div>



<button
class="start-btn"
id="startBtn">

🚀 Boshlash

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="periodInfo">
Period: 0 s
</p>

<p id="forceInfo">
Force: 0 N
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


canvas.width = 1000;
canvas.height = 650;


const massSlider =
document.getElementById("mass");

const kSlider =
document.getElementById("k");

const amplitudeSlider =
document.getElementById("amplitude");


const massValue =
document.getElementById("massValue");

const kValue =
document.getElementById("kValue");

const amplitudeValue =
document.getElementById("amplitudeValue");


const periodInfo =
document.getElementById("periodInfo");

const forceInfo =
document.getElementById("forceInfo");


massSlider.oninput = ()=>{

  massValue.innerHTML =
  massSlider.value + " kg";

};

kSlider.oninput = ()=>{

  kValue.innerHTML =
  kSlider.value + " N/m";

};

amplitudeSlider.oninput = ()=>{

  amplitudeValue.innerHTML =
  amplitudeSlider.value;

};



let time = 0;

let mass = 5;

let k = 10;

let amplitude = 100;



document
.getElementById("startBtn")
.addEventListener("click", ()=>{

  mass =
  parseFloat(massSlider.value);

  k =
  parseFloat(kSlider.value);

  amplitude =
  parseFloat(amplitudeSlider.value);

});



function drawSpring(x,y,length,coils){

  ctx.beginPath();

  ctx.moveTo(x,y);


  for(let i=0;i<coils;i++){

    const dx =
    x + (i+1)*(length/coils);

    const dy =
    y + (i%2===0 ? -20 : 20);

    ctx.lineTo(dx,dy);

  }


  ctx.lineTo(x+length,y);

  ctx.strokeStyle =
  "#cbd5e1";

  ctx.lineWidth = 4;

  ctx.stroke();

}



function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  time += 0.03;


  const omega =
  Math.sqrt(k/mass);


  const x =

  amplitude *

  Math.cos(omega*time);


  const centerX = 500;

  const centerY = 320;


  /* WALL */

  ctx.fillStyle =
  "#475569";

  ctx.fillRect(
    120,
    250,
    30,
    140
  );


  /* SPRING */

  drawSpring(

    150,
    centerY,

    300 + x,

    18

  );


  /* MASS */

  ctx.fillStyle =
  "#38bdf8";

  ctx.shadowBlur = 30;

  ctx.shadowColor =
  "#38bdf8";

  ctx.fillRect(

    450 + x,
    centerY - 40,

    80,
    80

  );


  /* INFO */

  const period =

  2*Math.PI*

  Math.sqrt(mass/k);


  periodInfo.innerHTML =

  "Period: " +

  period.toFixed(2)

  + " s";


  const force =
  -k * (x/100);


  forceInfo.innerHTML =

  "Force: " +

  force.toFixed(2)

  + " N";


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
