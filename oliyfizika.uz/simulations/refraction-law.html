
<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Refraction Law | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  margin-bottom:35px;

  font-size:30px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:10px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.start-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.start-btn:hover{

  transform:translateY(-3px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}


/* RESPONSIVE */

@media(max-width:1000px){

  .main{

    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="simulations.html"
class="back-btn">

🧪 Simulyatorlar

</a>

</nav>



<!-- MAIN -->

<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
🌈 Refraction Law
</h2>



<div class="control-group">

<label>
Tushish burchagi
</label>

<input
type="range"
id="angle"
min="0"
max="80"
value="45">

<div
class="value"
id="angleValue">

45°

</div>

</div>



<div class="control-group">

<label>
1-muhit sindirish ko‘rsatkichi
</label>

<input
type="range"
id="n1"
min="1"
max="2"
step="0.01"
value="1">

<div
class="value"
id="n1Value">

1.00

</div>

</div>



<div class="control-group">

<label>
2-muhit sindirish ko‘rsatkichi
</label>

<input
type="range"
id="n2"
min="1"
max="2.5"
step="0.01"
value="1.5">

<div
class="value"
id="n2Value">

1.50

</div>

</div>



<button
class="start-btn"
id="startBtn">

🚀 Yangilash

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="incidentInfo">
Incident Angle: 0°
</p>

<p id="refractedInfo">
Refracted Angle: 0°
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


canvas.width = 1000;
canvas.height = 650;


const angleSlider =
document.getElementById("angle");

const n1Slider =
document.getElementById("n1");

const n2Slider =
document.getElementById("n2");


const angleValue =
document.getElementById("angleValue");

const n1Value =
document.getElementById("n1Value");

const n2Value =
document.getElementById("n2Value");


const incidentInfo =
document.getElementById("incidentInfo");

const refractedInfo =
document.getElementById("refractedInfo");


angleSlider.oninput = ()=>{

  angleValue.innerHTML =
  angleSlider.value + "°";

};

n1Slider.oninput = ()=>{

  n1Value.innerHTML =
  parseFloat(n1Slider.value).toFixed(2);

};

n2Slider.oninput = ()=>{

  n2Value.innerHTML =
  parseFloat(n2Slider.value).toFixed(2);

};



let angle = 45;

let n1 = 1;

let n2 = 1.5;



document
.getElementById("startBtn")
.addEventListener("click", ()=>{

  angle =
  parseFloat(angleSlider.value);

  n1 =
  parseFloat(n1Slider.value);

  n2 =
  parseFloat(n2Slider.value);

});



function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* MEDIA */

  ctx.fillStyle =
  "rgba(56,189,248,.08)";

  ctx.fillRect(
    0,
    325,
    canvas.width,
    325
  );


  /* NORMAL */

  ctx.beginPath();

  ctx.moveTo(500,50);

  ctx.lineTo(500,600);

  ctx.strokeStyle =
  "rgba(255,255,255,.3)";

  ctx.lineWidth = 2;

  ctx.stroke();


  /* SURFACE */

  ctx.beginPath();

  ctx.moveTo(0,325);

  ctx.lineTo(1000,325);

  ctx.strokeStyle =
  "white";

  ctx.lineWidth = 3;

  ctx.stroke();


  const theta1 =
  angle * Math.PI/180;


  const sinTheta2 =

  (n1/n2) *
  Math.sin(theta1);


  let theta2 = 0;


  if(Math.abs(sinTheta2) <= 1){

    theta2 =
    Math.asin(sinTheta2);
  }


  /* INCIDENT RAY */

  const x1 =

  500 -
  250*Math.sin(theta1);

  const y1 =

  325 -
  250*Math.cos(theta1);


  ctx.beginPath();

  ctx.moveTo(x1,y1);

  ctx.lineTo(500,325);

  ctx.strokeStyle =
  "#38bdf8";

  ctx.lineWidth = 4;

  ctx.shadowBlur = 20;

  ctx.shadowColor =
  "#38bdf8";

  ctx.stroke();


  /* REFRACTED RAY */

  const x2 =

  500 +
  250*Math.sin(theta2);

  const y2 =

  325 +
  250*Math.cos(theta2);


  ctx.beginPath();

  ctx.moveTo(500,325);

  ctx.lineTo(x2,y2);

  ctx.strokeStyle =
  "#fde047";

  ctx.lineWidth = 4;

  ctx.shadowBlur = 20;

  ctx.shadowColor =
  "#fde047";

  ctx.stroke();


  /* INFO */

  incidentInfo.innerHTML =

  "Incident Angle: " +

  angle.toFixed(1)

  + "°";


  refractedInfo.innerHTML =

  "Refracted Angle: " +

  (theta2*180/Math.PI)
  .toFixed(1)

  + "°";


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
