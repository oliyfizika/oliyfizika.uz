
<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Projectile Motion | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  min-height:100vh;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  font-size:32px;

  margin-bottom:35px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;

  font-size:17px;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:12px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.launch-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.launch-btn:hover{

  transform:translateY(-4px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}


/* RESPONSIVE */

@media(max-width:1000px){

  .main{

    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="../index.html"
class="back-btn">

🏠 Bosh sahifa

</a>

</nav>



<!-- MAIN -->

<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
🧪 Projectile Motion
</h2>



<div class="control-group">

<label>
Burchak (°)
</label>

<input
type="range"
id="angle"
min="10"
max="80"
value="45">

<div
class="value"
id="angleValue">

45°

</div>

</div>



<div class="control-group">

<label>
Tezlik (m/s)
</label>

<input
type="range"
id="speed"
min="1"
max="50"
value="25">

<div
class="value"
id="speedValue">

25 m/s

</div>

</div>



<div class="control-group">

<label>
Gravitatsiya (m/s²)
</label>

<input
type="range"
id="gravity"
min="1"
max="20"
step="0.1"
value="9.8">

<div
class="value"
id="gravityValue">

9.8 m/s²

</div>

</div>



<button
class="launch-btn"
id="launchBtn">

🚀 Launch

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="timeInfo">
Time: 0 s
</p>

<p id="distanceInfo">
Distance: 0 m
</p>

<p id="heightInfo">
Height: 0 m
</p>

<p id="maxHeightInfo">
Max Height: 0 m
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


canvas.width = 1000;
canvas.height = 650;


const angleSlider =
document.getElementById("angle");

const speedSlider =
document.getElementById("speed");

const gravitySlider =
document.getElementById("gravity");


const angleValue =
document.getElementById("angleValue");

const speedValue =
document.getElementById("speedValue");

const gravityValue =
document.getElementById("gravityValue");


const launchBtn =
document.getElementById("launchBtn");


const timeInfo =
document.getElementById("timeInfo");

const distanceInfo =
document.getElementById("distanceInfo");

const heightInfo =
document.getElementById("heightInfo");

const maxHeightInfo =
document.getElementById("maxHeightInfo");

angleSlider.oninput = ()=>{

  angleValue.innerHTML =
  angleSlider.value + "°";

};

speedSlider.oninput = ()=>{

  speedValue.innerHTML =
  speedSlider.value + " m/s";

};

gravitySlider.oninput = ()=>{

  gravityValue.innerHTML =
  gravitySlider.value + " m/s²";

};



let projectile = null;

let trajectory = [];

let maxHeight = 0;

function launchProjectile(){

  trajectory = [];

  maxHeight = 0;

  const angle =
  angleSlider.value * Math.PI / 180;

  const speed =
  parseFloat(speedSlider.value);

  const gravity =
  parseFloat(gravitySlider.value);


  projectile = {

    x:60,
    y:560,

    vx:speed * Math.cos(angle),

    vy:-speed * Math.sin(angle),

    gravity:gravity,

    time:0

  };

}



launchBtn.addEventListener(
  "click",
  launchProjectile
);



function drawAxes(){

  ctx.strokeStyle =
  "rgba(255,255,255,.35)";

  ctx.lineWidth = 2;


  /* X AXIS */

  ctx.beginPath();

  ctx.moveTo(50,580);

  ctx.lineTo(960,580);

  ctx.stroke();


  /* Y AXIS */

  ctx.beginPath();

  ctx.moveTo(50,580);

  ctx.lineTo(50,40);

  ctx.stroke();


  /* LABELS */

  ctx.fillStyle = "white";

  ctx.font = "18px Poppins";

  ctx.fillText("X",930,565);

  ctx.fillText("Y",65,60);

}



function drawGround(){

  ctx.fillStyle =
  "#1e293b";

  ctx.fillRect(

    0,
    580,

    canvas.width,
    70

  );

}



function drawTrajectory(){

  ctx.beginPath();

  for(let i=0;i<trajectory.length;i++){

    const point =
    trajectory[i];


    if(i===0){

      ctx.moveTo(
        point.x,
        point.y
      );

    }

    else{

      ctx.lineTo(
        point.x,
        point.y
      );

    }

  }

  ctx.strokeStyle =
  "#38bdf8";

  ctx.lineWidth = 3;

  ctx.stroke();

}



function animate(){

  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  drawAxes();

  drawGround();


  if(projectile){

    projectile.time += 0.05;


    projectile.x +=
    projectile.vx * 0.5;


    projectile.vy +=
    projectile.gravity * 0.05;


    projectile.y +=
    projectile.vy * 0.5;


    trajectory.push({

      x:projectile.x,

      y:projectile.y

    });


    drawTrajectory();


    /* PROJECTILE */

    ctx.beginPath();

    ctx.arc(

      projectile.x,
      projectile.y,

      12,

      0,
      Math.PI * 2

    );

    ctx.fillStyle =
    "#38bdf8";

    ctx.shadowBlur = 20;

    ctx.shadowColor =
    "#38bdf8";

    ctx.fill();


    /* INFO */

    timeInfo.innerHTML =

    "Time: " +

    projectile.time.toFixed(2)

    + " s";


    distanceInfo.innerHTML =

    "Distance: " +

    (projectile.x / 10)
    .toFixed(1)

    + " m";


    const currentHeight =

    ((580 - projectile.y)/10);


    heightInfo.innerHTML =

    "Height: " +

    currentHeight.toFixed(1)

    + " m";



    if(currentHeight > maxHeight){

     maxHeight = currentHeight;

    }


    maxHeightInfo.innerHTML =

    "Max Height: " +

    maxHeight.toFixed(1)

    + " m";



    if(projectile.y > 570){

      projectile = null;

    }

  }


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
