<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Inclined Plane | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  margin-bottom:35px;

  font-size:30px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:10px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.start-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.start-btn:hover{

  transform:translateY(-3px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}

</style>

</head>

<body>

<div class="container">


<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="simulations.html"
class="back-btn">

🧪 Simulyatorlar

</a>

</nav>



<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
⛰️ Inclined Plane
</h2>



<div class="control-group">

<label>
Burchak (°)
</label>

<input
type="range"
id="angle"
min="5"
max="60"
value="30">

<div
class="value"
id="angleValue">

30°

</div>

</div>



<div class="control-group">

<label>
Massa (kg)
</label>

<input
type="range"
id="mass"
min="1"
max="50"
value="10">

<div
class="value"
id="massValue">

10 kg

</div>

</div>



<div class="control-group">

<label>
Ishqalanish μ
</label>

<input
type="range"
id="friction"
min="0"
max="1"
step="0.01"
value="0.2">

<div
class="value"
id="frictionValue">

0.20

</div>

</div>



<button
class="start-btn"
id="startBtn">

🚀 Boshlash

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="forceInfo">
Force: 0 N
</p>

<p id="frictionInfo">
Friction: 0 N
</p>

<p id="accelerationInfo">
Acceleration: 0 m/s²
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 650;


const angleSlider =
document.getElementById("angle");

const massSlider =
document.getElementById("mass");

const frictionSlider =
document.getElementById("friction");


const angleValue =
document.getElementById("angleValue");

const massValue =
document.getElementById("massValue");

const frictionValue =
document.getElementById("frictionValue");


const forceInfo =
document.getElementById("forceInfo");

const frictionInfo =
document.getElementById("frictionInfo");

const accelerationInfo =
document.getElementById("accelerationInfo");


angleSlider.oninput = ()=>{

  angleValue.innerHTML =
  angleSlider.value + "°";

};

massSlider.oninput = ()=>{

  massValue.innerHTML =
  massSlider.value + " kg";

};

frictionSlider.oninput = ()=>{

  frictionValue.innerHTML =
  parseFloat(frictionSlider.value)
  .toFixed(2);

};



let angle = 30;

let mass = 10;

let mu = 0.2;

let position = 0;

let velocity = 0;



document
.getElementById("startBtn")
.addEventListener("click", ()=>{

  angle =
  parseFloat(angleSlider.value);

  mass =
  parseFloat(massSlider.value);

  mu =
  parseFloat(frictionSlider.value);

  position = 0;

  velocity = 0;

});



function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const rad =
  angle * Math.PI/180;


  const startX = 250;

  const startY = 180;


  const length = 500;


  const endX =

  startX +

  length*Math.cos(rad);


  const endY =

  startY +

  length*Math.sin(rad);


  /* PLANE */

  ctx.beginPath();

  ctx.moveTo(startX,startY);

  ctx.lineTo(endX,endY);

  ctx.strokeStyle =
  "#cbd5e1";

  ctx.lineWidth = 8;

  ctx.stroke();


  /* PHYSICS */

  const g = 9.8;

  const parallelForce =

  mass * g * Math.sin(rad);


  const normalForce =

  mass * g * Math.cos(rad);


  const frictionForce =

  mu * normalForce;


  const netForce =

  parallelForce - frictionForce;


  const acceleration =

  netForce / mass;


  velocity +=
  acceleration * 0.02;


  position +=
  velocity * 0.5;


  if(position > length-60){

    position = length-60;

    velocity = 0;
  }


  /* BLOCK POSITION */

  const blockX =

  startX +

  position*Math.cos(rad);


  const blockY =

  startY +

  position*Math.sin(rad);


  ctx.save();

  ctx.translate(blockX,blockY);

  ctx.rotate(rad);


  ctx.fillStyle =
  "#38bdf8";

  ctx.shadowBlur = 25;

  ctx.shadowColor =
  "#38bdf8";

  ctx.fillRect(
    -30,
    -30,
    60,
    60
  );

  ctx.restore();


  /* FORCE ARROW */

  ctx.beginPath();

  ctx.moveTo(blockX,blockY);

  ctx.lineTo(

    blockX + 80*Math.cos(rad),

    blockY + 80*Math.sin(rad)

  );

  ctx.strokeStyle =
  "#f59e0b";

  ctx.lineWidth = 5;

  ctx.stroke();


  /* INFO */

  forceInfo.innerHTML =

  "Force: " +

  parallelForce.toFixed(2)

  + " N";


  frictionInfo.innerHTML =

  "Friction: " +

  frictionForce.toFixed(2)

  + " N";


  accelerationInfo.innerHTML =

  "Acceleration: " +

  acceleration.toFixed(2)

  + " m/s²";


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
