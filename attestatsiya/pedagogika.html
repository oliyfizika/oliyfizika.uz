<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedagogika Testlari</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#071a45,#0d2f80);
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    font-size:48px;
    margin-bottom:15px;
}

.subtitle{
    text-align:center;
    color:#c5d4ff;
    margin-bottom:40px;
}

.tests{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:25px;
}

.test-card{
    display:block;
    text-decoration:none;
    color:white;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);

    border-radius:25px;
    padding:30px;

    transition:.3s;
}

.test-card:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,.12);
}

.test-number{
    font-size:18px;
    color:#8fb4ff;
    margin-bottom:10px;
}

.test-title{
    font-size:30px;
    font-weight:700;
    margin-bottom:15px;
}

.test-info{
    color:#d6e1ff;
    line-height:1.6;
}

.back-btn{
    display:inline-block;
    margin-top:40px;
    color:white;
    text-decoration:none;
    padding:12px 25px;
    border-radius:12px;
    background:#2563eb;
}
</style>
</head>
<body>

<div class="container">

    <h1>📚 Pedagogika Testlari</h1>

    <p class="subtitle">
        Kerakli testni tanlang
    </p>

    <div class="tests">

        <a href="pedagogika-testlari/test1.html" class="test-card">

            <div class="test-number">
                Test №1
            </div>

            <div class="test-title">
                Pedagogika attestatsiyasi
            </div>

            <div class="test-info">
                20 ta savoldan iborat test.
            </div>

        </a>

        <a href="pedagogika-testlari/test2.html" class="test-card">

            <div class="test-number">
                Test №2
            </div>

            <div class="test-title">
                Pedagogika attestatsiyasi
            </div>

            <div class="test-info">
                20 ta savoldan iborat test.
            </div>

        </a>

        <a href="pedagogika-testlari/test3.html" class="test-card">

            <div class="test-number">
                Test №3
            </div>

            <div class="test-title">
                Pedagogika attestatsiyasi
            </div>

            <div class="test-info">
                20 ta savoldan iborat test.
            </div>

        </a>

    

        

    </div>

    <a href="attestatsiya.html"
       class="back-btn">
       ← Orqaga
    </a>

</div>

</body>
</html>
