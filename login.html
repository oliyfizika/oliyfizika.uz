<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  display:flex;

  justify-content:center;

  align-items:center;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.auth-box{

  width:450px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  border-radius:30px;

  padding:45px;
}

h1{

  text-align:center;

  font-size:46px;

  margin-bottom:35px;
}

h1 span{

  color:#38bdf8;
}

input{

  width:100%;

  padding:16px;

  margin-bottom:18px;

  border:none;

  border-radius:14px;

  background:rgba(255,255,255,.08);

  color:white;

  font-size:16px;

  outline:none;
}

input::placeholder{

  color:#cbd5e1;
}

button{

  width:100%;

  padding:16px;

  border:none;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:17px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

button:hover{

  transform:translateY(-3px);
}

.switch{

  text-align:center;

  margin-top:20px;

  color:#cbd5e1;
}

.switch span{

  color:#38bdf8;

  cursor:pointer;

  font-weight:700;
}

.message{

  margin-top:20px;

  text-align:center;

  font-weight:600;
}

.hidden{

  display:none;
}

</style>

</head>

<body>

<div class="auth-box">

<h1>
Oliy<span>Fizika</span>
</h1>



<!-- LOGIN -->

<div id="loginForm">

<input
type="text"
id="loginEmail"
placeholder="Email yoki Username">

<input
type="password"
id="loginPassword"
placeholder="Parol">

<button id="loginBtn">
Kirish
</button>

<div class="switch">

Akkount yo‘qmi?

<span onclick="showRegister()">
Ro‘yxatdan o‘tish
</span>

</div>

</div>



<!-- REGISTER -->

<div
id="registerForm"
class="hidden">

<input
type="email"
id="registerEmail"
placeholder="Email">

<input
type="text"
id="registerUsername"
placeholder="Username">

<input
type="password"
id="registerPassword"
placeholder="Kamida 8 belgili parol">

<input
type="text"
id="firstName"
placeholder="Ism">

<input
type="text"
id="lastName"
placeholder="Familya">

<button id="registerBtn">
Ro‘yxatdan o‘tish
</button>

<div class="switch">

Akkount bormi?

<span onclick="showLogin()">
Kirish
</span>

</div>

</div>


<div
class="message"
id="message">

</div>

</div>



<script type="module">

import {

  auth,
  db

}

from "./js/firebase.js";


import {

  createUserWithEmailAndPassword,

  signInWithEmailAndPassword,

  onAuthStateChanged

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

  doc,
  setDoc,
  getDocs,
  collection,
  query,
  where

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const message =
document.getElementById("message");



/* AUTO LOGIN */

onAuthStateChanged(auth, (user)=>{

  if(user){

    window.location.href =
    "profile.html";

  }

});



/* SWITCH */

window.showRegister = function(){

  document
  .getElementById("loginForm")
  .classList.add("hidden");

  document
  .getElementById("registerForm")
  .classList.remove("hidden");

}


window.showLogin = function(){

  document
  .getElementById("registerForm")
  .classList.add("hidden");

  document
  .getElementById("loginForm")
  .classList.remove("hidden");

}



/* REGISTER */

document
.getElementById("registerBtn")
.addEventListener("click", async ()=>{


  const email =
  document.getElementById("registerEmail").value;

  const username =
  document.getElementById("registerUsername").value;

  const password =
  document.getElementById("registerPassword").value;

  const firstName =
  document.getElementById("firstName").value;

  const lastName =
  document.getElementById("lastName").value;



  if(password.length < 8){

    message.textContent =
    "❌ Parol kamida 8 belgidan iborat";

    return;
  }



  try{


    const q = query(

      collection(db, "users"),

      where("username", "==", username)

    );


    const querySnapshot =
    await getDocs(q);


    if(!querySnapshot.empty){

      message.textContent =
      "❌ Username band";

      return;
    }



    const userCredential =

    await createUserWithEmailAndPassword(

      auth,
      email,
      password

    );


    const user =
    userCredential.user;



    await setDoc(

      doc(db, "users", user.uid),

      {

        username,
        firstName,
        lastName,
        email,

        xp:0,
        level:1

      }

    );



    message.textContent =
    "✅ Muvaffaqiyatli ro‘yxatdan o‘tildi";


    setTimeout(()=>{

      window.location.href =
      "profile.html";

    },1200);


  }

  catch(error){

    message.textContent =
    error.message;

  }

});



/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener("click", async ()=>{


  const loginInput =
  document.getElementById("loginEmail").value;

  const password =
  document.getElementById("loginPassword").value;



  try{


    let email = loginInput;


    if(!loginInput.includes("@")){


      const q = query(

        collection(db, "users"),

        where("username", "==", loginInput)

      );


      const querySnapshot =
      await getDocs(q);


      if(querySnapshot.empty){

        message.textContent =
        "❌ Username topilmadi";

        return;
      }


      email =
      querySnapshot.docs[0].data().email;

    }



    await signInWithEmailAndPassword(

      auth,
      email,
      password

    );


    message.textContent =
    "✅ Kirildi";


    setTimeout(()=>{

      window.location.href =
      "profile.html";

    },1000);


  }

  catch(error){

    message.textContent =
    "❌ Login yoki parol noto‘g‘ri";

  }

});

</script>

</body>
</html>
