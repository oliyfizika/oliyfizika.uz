<!--
  Virtual laboratoriyalar katalogi. Ma'lumot: data/manifest.json dagi `lab` maydoni bor yozuvlar
  ('maktab' — darslik laboratoriya ishlari, `grades` bo'yicha; 'otm' — oliy ta'lim laboratoriyalari).
  Sinf filtri URL da saqlanadi: ?sinf=7…11 yoki ?sinf=otm. Laboratoriya kodlari bu sahifada yuklanmaydi.
-->
<body class="of-ui" data-i18n-title="sim.labsTitle" data-shell-title="Virtual laboratoriyalar" data-shell-public="true">
<div class="of-page of-container of-cat of-cat--wide" id="labsPage">
  <header class="of-cat-head">
    <div>
      <h1 data-i18n="sim.labsTitle">Virtual laboratoriyalar</h1>
      <p data-i18n="sim.labsLead">Darslikdagi laboratoriya ishlarini virtual asboblar bilan bajaring: o‘lchang, natijani «Qaydlar»ga belgilang, jadvalni to‘ldiring va hisoblash natijasi bilan PDF hisobotni yuklab oling.</p>
    </div>
    <p class="of-cat-count" data-sim-count aria-live="polite"></p>
  </header>

  <section aria-labelledby="labListTitle">
    <h2 class="of-sr-only" id="labListTitle" data-i18n="sim.labsListTitle">Laboratoriya ishlari ro‘yxati</h2>
    <div class="of-segment of-grades" data-grades role="group" aria-label="Sinf bo‘yicha saralash" data-i18n-attr="aria-label:sim.gradesAria2"></div>
    <ul class="of-chips" data-chips role="group" aria-label="Bo‘lim bo‘yicha saralash" data-i18n-attr="aria-label:sim.topicsAria" style="margin-top:12px"></ul>

      <li><div class="of-card of-sim-card"><span class="of-skeleton" style="height:112px;border-radius:0"></span><div class="of-sim-card__body"><span class="of-skeleton of-skeleton--title"></span><span class="of-skeleton of-skeleton--text"></span></div></div></li>
