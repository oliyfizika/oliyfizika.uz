
<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Circular Motion | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  margin-bottom:35px;

  font-size:30px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:10px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.start-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.start-btn:hover{

  transform:translateY(-3px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}


/* RESPONSIVE */

@media(max-width:1000px){

  .main{

    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="simulations.html"
class="back-btn">

🧪 Simulyatorlar

</a>

</nav>



<!-- MAIN -->

<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
🌀 Circular Motion
</h2>



<div class="control-group">

<label>
Radius
</label>

<input
type="range"
id="radius"
min="50"
max="250"
value="150">

<div
class="value"
id="radiusValue">

150

</div>

</div>



<div class="control-group">

<label>
Tezlik
</label>

<input
type="range"
id="speed"
min="1"
max="10"
value="4">

<div
class="value"
id="speedValue">

4

</div>

</div>



<button
class="start-btn"
id="startBtn">

🚀 Boshlash

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="velocityInfo">
Velocity: 0 m/s
</p>

<p id="accelerationInfo">
Acceleration: 0 m/s²
</p>

<p id="omegaInfo">
Angular Velocity: 0
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


canvas.width = 1000;
canvas.height = 650;


const radiusSlider =
document.getElementById("radius");

const speedSlider =
document.getElementById("speed");


const radiusValue =
document.getElementById("radiusValue");

const speedValue =
document.getElementById("speedValue");


const velocityInfo =
document.getElementById("velocityInfo");

const accelerationInfo =
document.getElementById("accelerationInfo");

const omegaInfo =
document.getElementById("omegaInfo");


radiusSlider.oninput = ()=>{

  radiusValue.innerHTML =
  radiusSlider.value;

};

speedSlider.oninput = ()=>{

  speedValue.innerHTML =
  speedSlider.value;

};



let radius = 150;

let speed = 4;

let angle = 0;



document
.getElementById("startBtn")
.addEventListener("click", ()=>{

  radius =
  parseFloat(radiusSlider.value);

  speed =
  parseFloat(speedSlider.value);

});



function drawAxes(){

  ctx.strokeStyle =
  "rgba(255,255,255,.2)";

  ctx.lineWidth = 1;


  ctx.beginPath();

  ctx.moveTo(500,0);

  ctx.lineTo(500,650);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(0,325);

  ctx.lineTo(1000,325);

  ctx.stroke();

}



function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  drawAxes();


  const centerX = 500;

  const centerY = 325;


  /* CIRCLE */

  ctx.beginPath();

  ctx.arc(

    centerX,
    centerY,

    radius,

    0,
    Math.PI*2

  );

  ctx.strokeStyle =
  "rgba(255,255,255,.3)";

  ctx.lineWidth = 2;

  ctx.stroke();


  angle += speed * 0.01;


  const x =

  centerX +

  radius *
  Math.cos(angle);


  const y =

  centerY +

  radius *
  Math.sin(angle);


  /* RADIUS */

  ctx.beginPath();

  ctx.moveTo(centerX,centerY);

  ctx.lineTo(x,y);

  ctx.strokeStyle =
  "#38bdf8";

  ctx.lineWidth = 3;

  ctx.stroke();


  /* OBJECT */

  ctx.beginPath();

  ctx.arc(

    x,
    y,

    18,

    0,
    Math.PI*2

  );

  ctx.fillStyle =
  "#38bdf8";

  ctx.shadowBlur = 30;

  ctx.shadowColor =
  "#38bdf8";

  ctx.fill();


  /* INFO */

  const velocity = speed * 10;

  const acceleration =

  (velocity*velocity)/(radius/50);

  const omega =

  velocity/(radius/50);


  velocityInfo.innerHTML =

  "Velocity: " +

  velocity.toFixed(1)

  + " m/s";


  accelerationInfo.innerHTML =

  "Acceleration: " +

  acceleration.toFixed(1)

  + " m/s²";


  omegaInfo.innerHTML =

  "Angular Velocity: " +

  omega.toFixed(2);


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
