
<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Ohm Law | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  margin-bottom:35px;

  font-size:30px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:10px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.start-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.start-btn:hover{

  transform:translateY(-3px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}


/* RESPONSIVE */

@media(max-width:1000px){

  .main{

    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="container">


<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="simulations.html"
class="back-btn">

🧪 Simulyatorlar

</a>

</nav>



<!-- MAIN -->

<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
⚡ Ohm Law
</h2>



<div class="control-group">

<label>
Kuchlanish U (Volt)
</label>

<input
type="range"
id="voltage"
min="1"
max="220"
value="100">

<div
class="value"
id="voltageValue">

100 V

</div>

</div>



<div class="control-group">

<label>
Qarshilik R (Ohm)
</label>

<input
type="range"
id="resistance"
min="1"
max="100"
value="20">

<div
class="value"
id="resistanceValue">

20 Ω

</div>

</div>



<button
class="start-btn"
id="startBtn">

🚀 Hisoblash

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="currentInfo">
Current: 0 A
</p>

<p id="voltageInfo">
Voltage: 0 V
</p>

<p id="resistanceInfo">
Resistance: 0 Ω
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


canvas.width = 1000;
canvas.height = 650;


const voltageSlider =
document.getElementById("voltage");

const resistanceSlider =
document.getElementById("resistance");


const voltageValue =
document.getElementById("voltageValue");

const resistanceValue =
document.getElementById("resistanceValue");


const currentInfo =
document.getElementById("currentInfo");

const voltageInfo =
document.getElementById("voltageInfo");

const resistanceInfo =
document.getElementById("resistanceInfo");


voltageSlider.oninput = ()=>{

  voltageValue.innerHTML =
  voltageSlider.value + " V";

};

resistanceSlider.oninput = ()=>{

  resistanceValue.innerHTML =
  resistanceSlider.value + " Ω";

};



let voltage = 100;

let resistance = 20;

let current = 5;



document
.getElementById("startBtn")
.addEventListener("click", ()=>{

  voltage =
  parseFloat(voltageSlider.value);

  resistance =
  parseFloat(resistanceSlider.value);

  current =
  voltage / resistance;

});



let flowOffset = 0;



function drawElectron(x,y){

  ctx.beginPath();

  ctx.arc(

    x,
    y,

    6,

    0,
    Math.PI*2

  );

  ctx.fillStyle =
  "#38bdf8";

  ctx.fill();

}



function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  flowOffset += current * 0.8;


  /* WIRES */

  ctx.strokeStyle =
  "#cbd5e1";

  ctx.lineWidth = 6;


  ctx.beginPath();

  ctx.moveTo(200,180);

  ctx.lineTo(800,180);

  ctx.lineTo(800,480);

  ctx.lineTo(200,480);

  ctx.lineTo(200,180);

  ctx.stroke();


  /* BATTERY */

  ctx.fillStyle =
  "#475569";

  ctx.fillRect(170,260,20,120);

  ctx.fillRect(200,240,12,160);


  /* RESISTOR */

  ctx.fillStyle =
  "#f59e0b";

  ctx.fillRect(500,160,120,40);


  /* BULB */

  const glow =

  Math.min(current*8,50);


  ctx.beginPath();

  ctx.arc(

    800,
    330,

    45,

    0,
    Math.PI*2

  );

  ctx.fillStyle =
  "#fde047";

  ctx.shadowBlur = glow;

  ctx.shadowColor =
  "#fde047";

  ctx.fill();


  /* ELECTRONS */

  for(let i=0;i<20;i++){

    let x =

    220 +

    ((i*80 + flowOffset)
    % 1160);


    let y = 180;


    if(x > 780){

      y = 180 + (x-780);

      x = 800;
    }

    if(y > 480){

      x = 800 - (y-480);

      y = 480;
    }

    if(x < 220 && y===480){

      y = 480 - (220-x);

      x = 200;
    }


    drawElectron(x,y);

  }


  /* INFO */

  currentInfo.innerHTML =

  "Current: " +

  current.toFixed(2)

  + " A";


  voltageInfo.innerHTML =

  "Voltage: " +

  voltage.toFixed(1)

  + " V";


  resistanceInfo.innerHTML =

  "Resistance: " +

  resistance.toFixed(1)

  + " Ω";


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
