<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Newton Second Law | OliyFizika.uz</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{

  min-height:100vh;

  background:
  linear-gradient(135deg,#020817,#07122f,#020817);

  color:white;

  overflow:hidden;
}

body::before{

  content:"";

  position:fixed;

  inset:0;

  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%);

  z-index:-1;
}

.container{

  width:92%;

  max-width:1450px;

  margin:auto;
}


/* NAVBAR */

.navbar{

  margin-top:20px;

  padding:18px 28px;

  border-radius:24px;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(18px);

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.logo{

  font-size:38px;

  font-weight:800;
}

.logo span{

  color:#38bdf8;
}

.back-btn{

  text-decoration:none;

  color:white;

  padding:14px 24px;

  border-radius:16px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  font-weight:600;
}


/* MAIN */

.main{

  display:grid;

  grid-template-columns:360px 1fr;

  gap:30px;

  margin-top:35px;
}


/* CONTROLS */

.controls{

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  backdrop-filter:blur(20px);

  border-radius:30px;

  padding:30px;
}

.controls h2{

  margin-bottom:35px;

  font-size:30px;
}

.control-group{

  margin-bottom:30px;
}

.control-group label{

  display:block;

  margin-bottom:12px;

  color:#cbd5e1;
}

.control-group input{

  width:100%;
}

.value{

  margin-top:10px;

  color:#38bdf8;

  font-weight:700;

  font-size:18px;
}

.start-btn{

  width:100%;

  padding:18px;

  border:none;

  border-radius:18px;

  background:
  linear-gradient(135deg,#2563eb,#38bdf8);

  color:white;

  font-size:18px;

  font-weight:700;

  cursor:pointer;

  transition:.3s;
}

.start-btn:hover{

  transform:translateY(-3px);
}


/* CANVAS */

.canvas-box{

  position:relative;

  background:rgba(255,255,255,.05);

  border:1px solid rgba(255,255,255,.08);

  border-radius:30px;

  overflow:hidden;
}

canvas{

  width:100%;

  height:100%;

  display:block;
}

.info{

  position:absolute;

  top:20px;

  left:20px;

  background:rgba(0,0,0,.35);

  padding:18px 22px;

  border-radius:20px;

  backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,.08);
}

.info p{

  margin-bottom:10px;

  font-size:16px;
}

</style>

</head>

<body>

<div class="container">


<nav class="navbar">

<div class="logo">
Oliy<span>Fizika</span>
</div>

<a href="simulations.html"
class="back-btn">

🧪 Simulyatorlar

</a>

</nav>



<div class="main">


<!-- CONTROLS -->

<div class="controls">

<h2>
⚙️ Newton Second Law
</h2>



<div class="control-group">

<label>
Kuch F (N)
</label>

<input
type="range"
id="force"
min="1"
max="100"
value="20">

<div
class="value"
id="forceValue">

20 N

</div>

</div>



<div class="control-group">

<label>
Massa m (kg)
</label>

<input
type="range"
id="mass"
min="1"
max="50"
value="10">

<div
class="value"
id="massValue">

10 kg

</div>

</div>



<button
class="start-btn"
id="startBtn">

🚀 Boshlash

</button>

</div>



<!-- CANVAS -->

<div class="canvas-box">

<div class="info">

<p id="forceInfo">
Force: 0 N
</p>

<p id="massInfo">
Mass: 0 kg
</p>

<p id="accelerationInfo">
Acceleration: 0 m/s²
</p>

<p id="velocityInfo">
Velocity: 0 m/s
</p>

</div>

<canvas id="canvas">

</canvas>

</div>

</div>

</div>



<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

canvas.width = 1000;
canvas.height = 650;


const forceSlider =
document.getElementById("force");

const massSlider =
document.getElementById("mass");


const forceValue =
document.getElementById("forceValue");

const massValue =
document.getElementById("massValue");


const forceInfo =
document.getElementById("forceInfo");

const massInfo =
document.getElementById("massInfo");

const accelerationInfo =
document.getElementById("accelerationInfo");

const velocityInfo =
document.getElementById("velocityInfo");


forceSlider.oninput = ()=>{

  forceValue.innerHTML =
  forceSlider.value + " N";

};

massSlider.oninput = ()=>{

  massValue.innerHTML =
  massSlider.value + " kg";

};



let force = 20;
let mass = 10;

let acceleration = 2;

let velocity = 0;

let blockX = 120;



document
.getElementById("startBtn")
.addEventListener("click", ()=>{

  force =
  parseFloat(forceSlider.value);

  mass =
  parseFloat(massSlider.value);

  acceleration =
  force / mass;

});



function drawArrow(x,y,length){

  ctx.beginPath();

  ctx.moveTo(x,y);

  ctx.lineTo(x+length,y);

  ctx.strokeStyle =
  "#38bdf8";

  ctx.lineWidth = 5;

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(x+length,y);

  ctx.lineTo(x+length-18,y-10);

  ctx.lineTo(x+length-18,y+10);

  ctx.closePath();

  ctx.fillStyle =
  "#38bdf8";

  ctx.fill();

}



function animate(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* GROUND */

  ctx.fillStyle =
  "#1e293b";

  ctx.fillRect(
    0,
    480,
    canvas.width,
    170
  );


  /* MOTION */

  velocity +=
  acceleration * 0.02;

  blockX +=
  velocity * 0.5;


  if(blockX > 920){

    blockX = 120;

    velocity = 0;
  }


  /* FORCE ARROW */

  drawArrow(
    blockX - 80,
    360,
    60 + force
  );


  /* BLOCK */

  ctx.fillStyle =
  "#38bdf8";

  ctx.shadowBlur = 30;

  ctx.shadowColor =
  "#38bdf8";

  ctx.fillRect(

    blockX,
    320,

    120,
    120

  );


  /* LABEL */

  ctx.fillStyle =
  "white";

  ctx.font =
  "24px Poppins";

  ctx.fillText(

    mass + " kg",

    blockX + 22,
    390

  );


  /* INFO */

  forceInfo.innerHTML =

  "Force: " +

  force.toFixed(1)

  + " N";


  massInfo.innerHTML =

  "Mass: " +

  mass.toFixed(1)

  + " kg";


  accelerationInfo.innerHTML =

  "Acceleration: " +

  acceleration.toFixed(2)

  + " m/s²";


  velocityInfo.innerHTML =

  "Velocity: " +

  velocity.toFixed(2)

  + " m/s";


  requestAnimationFrame(
    animate
  );

}


animate();

</script>

</body>
</html>
