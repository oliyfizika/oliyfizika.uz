<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 30 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ To'yingan bug'
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"$1 \text{ m}^3$ havo tarkibidagi suv bug'ining (grammlardagi) massasiga nima deyiladi?",
a:["Nisbiy namlik","Absolyut namlik","Parsial bosim","To'yingan bug'"],
c:1
},

{
q:"Havoning absolyut namligi Xalqaro birliklar sistemasida (XBS) qanday birlikda o'lchanadi?",
a:["$ \text{%} $","$ \text{Pa} $","$ \text{kg/m}^3 $","$ \text{g} $"],
c:2
},

{
q:"Havoning nisbiy namligini (φ) aniqlash formulasini ko'rsating.",
a:["φ = (ρ_a / ρ_T) * 100%","φ = P * V","φ = m / M","φ = ρ * g * h"],
c:0
},

{
q:"Havoning namligini o'lchash uchun ishlatiladigan, nam va quruq termometrlardan tashkil topgan asbob nima deyiladi?",
a:["Barometr","Gigrometr","Psixrometr","Areometr"],
c:2
},

{
q:"Havodagi suv bug'lari to'yingan holatga o'tadigan (kondensatsiyalana boshlaydigan) temperatura nima deyiladi?",
a:["Kritik temperatura","Absolyut nol","Shudring nuqtasi","Qaynash temperaturasi"],
c:2
},

{
q:"Agar havoda suv bug'lari mutlaqo bo'lmasa, uning absolyut va nisbiy namligi nimaga teng bo'ladi?",
a:["100 ga","Nolga","Dengiz sathidagi bosimga","Cheksiz"],
c:1
},

{
q:"Lambrext gigrometrining ishlash prinsipi nimaga asoslangan?",
a:["Simobning kengayishiga","Inson sochining namlik ta'sirida uzayishiga","Suyuqlikning bug'lanishiga","Elektr qarshiligining o'zgarishiga"],
c:1
},

{
q:"Hajmi $4 \text{ m}^3$ bo'lgan havo tarkibida $80 \text{ g}$ suv bug'i bor. Havoning absolyut namligini toping ($\text{g/m}^3$).",
a:["40","30","20","10"],
c:2
},

{
q:"Havo harorati ortishi bilan uning nisbiy namligi qanday o'zgaradi?",
a:["Ortadi","Kamayadi","O'zgarmaydi","Dastlab kamayib, keyin ortadi"],
c:1
},

{
q:"Psixrometrda nam termometr quruq termometrga qaraganda pastroq haroratni ko'rsatishiga sabab nima?",
a:["Atmosfera bosimi pastligi","Nam matodagi suvning bug'lanishi natijasida issiqlik yutilishi (sovish)","Termometrning nosozligi","Xonadagi shamol esishi"],
c:1
},

{
q:"Havoning nisbiy namligi $100\text{%}$ bo'lsa, psixrometrdagi termometrlar ko'rsatishi qanday bo'ladi?",
a:["Quruq termometr yuqori ko'rsatadi","Nam termometr yuqori ko'rsatadi","Ikkala termometr ko'rsatishi teng bo'ladi","Nam termometr noldan pastni ko'rsatadi"],
c:2
},

{
q:"O'zining suyuqligi bilan termodinamik muvozanatda bo'lgan bug' qanday ataladi?",
a:["To'yingan bug'","To'yinmagan bug'","Ideal gaz","Real gaz"],
c:0
},

{
q:"To'yingan bug' bosimi uning qaysi parametriga bog'liq emas?",
a:["Temperaturasiga","Hajmiga","Molekulalar konsentratsiyasiga","Zichligiga"],
c:1
},

{
q:"Shudring nuqtasida havoning nisbiy namligi necha foizga teng bo'ladi?",
a:["0%","50%","100%","75%"],
c:2
},

{
q:"Xonaning hajmi $180 \text{ m}^3$ va undagi havoning absolyut namligi $15 \text{ g/m}^3$. Xonada qancha suv bug'i bor ($\text{kg}$)?",
a:["2,4","1,6","2,7","3,8"],
c:2
},

{
q:"Nisbiy namlikni o'lchashda psixrometrik jadvaldan foydalanish uchun qanday ma'lumotlar kerak?",
a:["Faqat xona harorati","Quruq termometr ko'rsatishi va quruq hamda nam termometrlar ko'rsatishlari ayirmasi","Faqat nam termometr ko'rsatishi","Atmosfera bosimi"],
c:1
},

{
q:"Suyuqlik bug'langanda energiya yutiladimi yoki ajraladimi?",
a:["Yutiladi","Ajraladi","O'zgarmaydi","Suyuqlik turiga bog'liq"],
c:0
},

{
q:"Kritik temperaturadan yuqori haroratlarda modda qaysi holatda bo'ladi?",
a:["Faqat suyuq","Faqat gaz (bug'ni siqib suyuqlikka aylantirib bo'lmaydi)","To'yingan bug'","Plazma"],
c:1
},

{
q:"Qaysi jarayon suyuqlikning butun hajmi bo'ylab bug'lanishi deb ataladi?",
a:["Sublimatsiya","Kondensatsiya","Qaynash","Diffuziya"],
c:2
},

{
q:"Absolyut namlik $10 \text{ g/m}^3$, shu haroratdagi to'yingan bug' zichligi esa $20 \text{ g/m}^3$ bo'lsa, nisbiy namlikni toping.",
a:["20%","50%","100%","10%"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
