<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 9 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Vertikal harakat
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Erkin tushish deb nimaga aytiladi?",
a:["Havo qarshiligi ostidagi harakatga","Faqat og'irlik kuchi ta'siridagi harakatga","Tezligi o'zgarmas harakatga","Egri chiziqli harakatga"],
c:1
},

{
q:"Erkin tushish tezlanishi (g) Yerning qayerida eng katta qiymatga (9,83 m/s²) ega?",
a:["Ekvatorda","Qutblarda","Tog' tepasida","Dengiz sathida"],
c:1
},

{
q:"Erkin tushish tezlanishi Yer ekvatorida taxminan qanchaga teng?",
a:["9,83 m/s²","9,81 m/s²","9,78 m/s²","10 m/s²"],
c:2
},

{
q:"Erkin tushish tezlanishining (g) qiymati nimalarga bog'liq?",
a:["Faqat jism massasiga","Planetaning massasi, radiusi va zichligiga","Jismning shakli va hajmiga","Atmosfera bosimiga"],
c:1
},

{
q:"Erkin tushayotgan jism qanday turdagi harakatni amalga oshiradi?",
a:["Tekis harakat","Tekis sekinlanuvchan","Tekis tezlanuvchan","Egri chiziqli"],
c:2
},

{
q:"Yuqoriga tik otilgan jismning ko'tarilishdagi harakati qanday bo'ladi?",
a:["Tekis tezlanuvchan","Tekis sekinlanuvchan","Notekis o'zgaruvchan","Aylanma"],
c:1
},

{
q:"Yuqoriga tik otilgan jismda tezlik va tezlanish vektorlari yo'nalishi qanday joylashadi?",
a:["Bir tomonga yo'nalgan","O'zaro perpendikulyar","O'zaro qarama-qarshi","Burchak ostida"],
c:2
},

{
q:"Yuqoriga tik otilgan jism trayektoriyasining eng yuqori nuqtasida oniy tezligi nimaga teng?",
a:["Boshlang'ich tezlikka","Nolga","Erkin tushish tezlanishiga (g)","Maksimal tezlikka"],
c:1
},

{
q:"Tinch holatdan (v0=0) erkin tushayotgan jismning tushish vaqti qaysi formula bilan topiladi?",
a:["t = v/g","t = √(2h/g)","t = h/g","t = g/h"],
c:1
},

{
q:"Yuqoriga tik otilgan jismning maksimal ko'tarilish vaqti qaysi formula bilan aniqlanadi?",
a:["t = v0/g","t = √(2h/g)","t = v0 * g","t = g/v0"],
c:0
},

{
q:"Ideal holatda (havo qarshiligisiz) jismning ko'tarilish vaqti va tushish vaqti munosabati qanday?",
a:["Ko'tarilish vaqti tushish vaqtidan ko'p","Tushish vaqti ko'tarilish vaqtidan ko'p","Ular o'zaro teng","Boshlang'ich tezlikka bog'liq emas"],
c:2
},

{
q:"Real holatda ko'tarilish vaqti tushish vaqtiga teng bo'lmasligining asosiy sababi nima?",
a:["Inersiya hodisasi","Havoning qarshilik kuchi","Yerning o'z o'qi atrofida aylanishi","Gravitatsiya doimiysining o'zgarishi"],
c:1
},

{
q:"Erkin tushayotgan jismning n-chi sekunddagi ko'chishi (Sn) qaysi formula bilan topiladi?",
a:["Sn = g(2n-1)/2","Sn = gt²/2","Sn = v0 + at","Sn = g/2"],
c:0
},

{
q:"Erkin tushayotgan jismning tezlik va tezlanish vektorlari qayerga yo'nalgan bo'ladi?",
a:["Gorizontal yo'nalishda","Vertikal yuqoriga","Vertikal pastga (Yer markaziga)","Harakatga teskari yo'nalishda"],
c:2
},

{
q:"Yer yuzi turli nuqtalarida g ning qiymati turlicha bo'lishiga sabab nima?",
a:["Havo harorati har xilligi","Yer sharining radiusi turli nuqtalarda turlichaligi","Dengiz sathidan balandlik o'zgarmasligi","Quyoshning tortish kuchi"],
c:1
},

{
q:"Jismning boshlang'ich tezliksiz (v0=0) tushish balandligi (h) formulasi qaysi?",
a:["h = gt²/2","h = vt","h = gt","h = v²/g"],
c:0
},

{
q:"Yuqoriga tik otilgan jismning maksimal ko'tarilish balandligi (h_max) qanday aniqlanadi?",
a:["h = v0²/2g","h = v0/g","h = gt²/2","h = v0t"],
c:0
},

{
q:"Erkin tushayotgan jismning t vaqtdagi oniy tezligi (v) qanday topiladi?",
a:["v = v0 + gt","v = gt²/2","v = √(2gh)","v = v0 - gt"],
c:0
},

{
q:"Vertikal harakatda erkin tushish tezlanishi (g) har doim qayerga yo'nalgan?",
a:["Harakat yo'nalishida","Harakatga qarama-qarshi","Vertikal pastga (Yer markaziga)","Gorizontal yo'nalishda"],
c:2
},

{
q:"Havoning qarshiligi hisobga olinsa, yuqoriga tik otilgan jismning to'liq mexanik energiyasi qachon eng katta bo'ladi?",
a:["Otilish boshida","Eng yuqori nuqtaga yetganda","Tushish o'rtasida","Yerga tushish momentida"],
c:0
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
