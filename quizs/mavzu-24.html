<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 24 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Rezonans va mexanik to'lqinlar
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Sistemaga ta’sir etuvchi tashqi kuch chastotasi sistemaning erkin tebranishlar chastotasiga tenglashganda, majburiy tebranishlar amplitudasining keskin ortishi nima deyiladi?",
a:["Interferensiya","Rezonans","Difraksiya","Dopler effekti"],
c:1
},

{
q:"'Rezonans' so'zi qanday ma'noni bildiradi?",
a:["Kuchayish","Tebranish","Aks-sado","Qaytarish"],
c:2
},

{
q:"Tebranish davri T bo'lgan matematik mayatnikda rezonans yuzaga kelishi uchun tashqi ta'sir chastotasi (ν) qanday bo'lishi kerak?",
a:["ν = T","ν = 1/T","ν = 2πT","ν = T/2π"],
c:1
},

{
q:"Tebranishlarning elastik muhitda tarqalishi nima deyiladi?",
a:["Garmonik tebranish","Mexanik to'lqin","Avtotebranish","Interferensiya"],
c:1
},

{
q:"Muhit zarrachalarining tebranish yo'nalishi to'lqin tarqalish yo'nalishiga parallel bo'lgan to'lqinlar qanday ataladi?",
a:["Ko'ndalang to'lqinlar","Bo'ylama to'lqinlar","Sferik to'lqinlar","Uzluksiz to'lqinlar"],
c:1
},

{
q:"Muhit zarrachalari to'lqin tarqalish yo'nalishiga perpendikulyar yo'nalishda tebranadigan to'lqinlar nima deyiladi?",
a:["Bo'ylama to'lqinlar","Garmonik to'lqinlar","Ko'ndalang to'lqinlar","Akustik to'lqinlar"],
c:2
},

{
q:"Mexanik to'lqinlarning tarqalish tezligi qanday muhitda eng katta bo'ladi?",
a:["Havoda","Suvda","Qattiq jismda","Vakuumda"],
c:2
},

{
q:"Mexanik to'lqinlar quyidagi parametrlarning qaysi biri bir muhitdan boshqasiga o'tganda o'zgarmaydi?",
a:["Tezligi","To'lqin uzunligi","Amplitudasi","Chastotasi"],
c:3
},

{
q:"Inson qulog'i qabul qiladigan tovush to'lqinlari qanday chastota oralig'ini egallaydi?",
a:["1 Hz dan 100 Hz gacha","17 Hz dan 20000 Hz gacha","17 kHz dan 50 kHz gacha","20000 Hz dan yuqori"],
c:1
},

{
q:"Chastotasi 20000 Hz dan katta bo'lgan mexanik to'lqinlarga nima deyiladi?",
a:["Infratovush","Ultratovush","Gipertovush","Akustik tovush"],
c:1
},

{
q:"Chastotasi 17 Hz dan kichik bo'lgan mexanik to'lqinlarga nima deyiladi?",
a:["Infratovush","Ultratovush","Relyativistik to'lqin","Gers to'lqini"],
c:0
},

{
q:"Tovushning yuksakligi (balandligi) uning qaysi parametriga bog'liq?",
a:["Amplitudasiga","Tezligiga","Chastotasiga","Fazasiga"],
c:2
},

{
q:"Tovushning qattiqligi (baland-pastligi) nimaga bog'liq?",
a:["Tebranish chastotasiga","Tebranish amplitudasiga","To'lqin uzunligiga","Muhit zichligiga"],
c:1
},

{
q:"Chastotalari bir xil va fazalar farqi o'zgarmas bo'lgan to'lqinlar nima deb ataladi?",
a:["Kogerent to'lqinlar","Monoxromatik to'lqinlar","Bo'ylama to'lqinlar","Garmonik to'lqinlar"],
c:0
},

{
q:"Ikki kogerent to'lqin qo'shilganda hosil bo'lgan natijaviy to'lqin amplitudasining kuchayishi yoki susayishi hodisasi nima deyiladi?",
a:["Difraksiya","Interferensiya","Dispersiya","Rezonans"],
c:1
},

{
q:"To'lqinlarning to'siqlarni aylanib o'tishi va soya sohasiga og'ib tarqalishi nima deyiladi?",
a:["Refraksiya","Interferensiya","Difraksiya","Polyarizatsiya"],
c:2
},

{
q:"Bir xil fazada tebranuvchi nuqtalarning geometrik o'rni nima deb ataladi?",
a:["To'lqin uzunligi","To'lqin sirti","To'lqin nuri","Amplituda"],
c:1
},

{
q:"Tovush to'lqinlari qaysi muhitda mutlaqo tarqala olmaydi?",
a:["Qattiq jismda","Suyuqlikda","Gazda","Vakuumda"],
c:3
},

{
q:"Inson tovush manbalarini (masalan, turli cholg'u asboblarini) bir-biridan qaysi xossasiga ko'ra ajrata oladi?",
a:["Balandligiga","Tembriga","Tezligiga","Fazasiga"],
c:1
},

{
q:"Bir-biriga eng yaqin va bir xil fazada tebranuvchi nuqtalar orasidagi masofa nima deyiladi?",
a:["To'lqin uzunligi","Amplituda","Siljish","To'lqin sirti"],
c:0
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
