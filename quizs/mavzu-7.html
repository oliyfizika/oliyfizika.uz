<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 7 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Butun olam tortishish qonuni
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Butun olam tortishish qonuniga ko'ra, ikki moddiy nuqta orasidagi tortishish kuchi qanday aniqlanadi?",
a:["Massalar yig'indisiga to'g'ri proporsional","Massalar ko'paytmasiga to'g'ri, masofa kvadratiga teskari proporsional","Masofaga to'g'ri proporsional","Faqat jismlar zichligiga bog'liq"],
c:1
},

{
q:"Gravitatsion doimiysining (G) son qiymati qanchaga teng?",
a:["9,81 m/s²","6,67 • 10^-11 N·m²/kg²","1,6 • 10^-19 Cl","3 • 10^8 m/s"],
c:1
},

{
q:"Gravitatsion doimiyning qiymatini birinchi bo'lib tajribada kim aniqlagan?",
a:["I. Nyuton","G. Galiley","Kavendish","A. Eynshteyn"],
c:2
},

{
q:"Kavendish gravitatsion doimiyni o'lchashda qaysi asbobdan foydalangan?",
a:["Dinamometr","Sezgir burama tarozi","Akselerometr","Barometr"],
c:1
},

{
q:"Qaysi sayyora Butun olam tortishish qonuni ifodasi yordamida (nazariy hisoblab) topilgan?",
a:["Mars","Venera","Pluton","Yupiter"],
c:2
},

{
q:"Gravitatsion ta'sir qanday zarralar orqali amalga oshadi?",
a:["Fotonlar","Glyuonlar","Gravitonlar","Neytronlar"],
c:2
},

{
q:"Erkin tushish tezlanishi (g) ning qiymati nimalarga bog'liq?",
a:["Faqat jism massasiga","Planeta massasi, radiusi va zichligiga","Faqat jismning shakliga","Havo haroratiga"],
c:1
},

{
q:"Erkin tushish tezlanishi Yerning qayerida eng katta qiymatga (9,83 m/s²) ega?",
a:["Ekvatorda","Qutblarda","Tog' cho'qqisida","Dengiz sathida"],
c:1
},

{
q:"Jism Yerning sun'iy yo'ldoshi bo'lib qolishi uchun unga berilishi kerak bo'lgan eng kichik tezlik nima deyiladi?",
a:["Ikkinchi kosmik tezlik","Birinchi kosmik tezlik","Yorug'lik tezligi","Tovush tezligi"],
c:1
},

{
q:"Birinchi kosmik tezlikning qiymati taxminan qanchaga teng?",
a:["11,2 km/s","16,7 km/s","7,9 km/s","300 000 km/s"],
c:2
},

{
q:"Jism Yerning tortish maydonini yengib, Quyoshning sun'iy yo'ldoshiga aylanishi uchun kerakli tezlik (11,2 km/s) nima deyiladi?",
a:["Birinchi kosmik tezlik","Ikkinchi kosmik tezlik","Uchinchi kosmik tezlik","Oniy tezlik"],
c:1
},

{
q:"Uchinchi kosmik tezlik (16,7 km/s) qanday maqsad uchun zarur?",
a:["Yer atrofida aylanish uchun","Oyga qo'nish uchun","Quyosh sistemasini tark etish uchun","Atmosferadan chiqmaslik uchun"],
c:2
},

{
q:"Lift yuqoriga a tezlanish bilan harakatlansa, jismning og'irligi qanday o'zgaradi?",
a:["O'zgarmaydi","Kamayadi (P=m(g-a))","Ortadi (P=m(g+a))","Nolga teng bo'ladi"],
c:2
},

{
q:"Lift a=g tezlanish bilan pastga tushsa, jismda qanday holat yuz beradi?",
a:["Og'irligi ikki marta ortadi","Vaznsizlik holati (P=0)","Inersiya ortadi","Tezligi o'zgarmaydi"],
c:1
},

{
q:"Qavariq ko'prikning eng yuqori nuqtasida jism og'irligi qanday topiladi?",
a:["P = m(g + v²/R)","P = mg","P = m(g - v²/R)","P = 0"],
c:2
},

{
q:"Botiq ko'prikning eng quyi nuqtasida harakatlanayotgan jism og'irligi qanday aniqlanadi?",
a:["P = m(g + v²/R)","P = m(g - v²/R)","P = mg","P = mv²/R"],
c:0
},

{
q:"Barcha planetalar orbitalari ellipsdan iborat bo'lib, uning fokuslaridan birida Quyosh turishi qaysi qonun?",
a:["Nyutonning 1-qonuni","Keplerning 1-qonuni","Guk qonuni","Paskal qonuni"],
c:1
},

{
q:"Yerga tortilishi natijasida jismning tayanch yoki ilgakka ko'rsatadigan bosim kuchi nima deyiladi?",
a:["Massa","Inersiya","Og'irlik","Ishqalanish"],
c:2
},

{
q:"Agar kosmik kema tezligi 16,7 km/s dan katta bo'lsa, uning orbitasi qanday shaklda bo'ladi?",
a:["Aylana","Ellips","Parabola","Giperbola"],
c:3
},

{
q:"Gravitatsion ta'sir qaysi zarralar orasida paydo bo'ladi?",
a:["Faqat zaryadli zarralar","Faqat nuklonlar","Barcha zarralar","Faqat metallar"],
c:2
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
