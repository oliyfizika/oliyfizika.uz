<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quizlar | OliyFizika.uz</title>
<meta name="description" content="Fizika mavzulari bo‘yicha tezkor quizlar: mexanika, molekulyar fizika, elektr va magnetizm, optika va zamonaviy fizika.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="../assets/js/core/theme-boot.js"></script>
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/catalog.css">
<script type="module" src="../assets/js/shell/app-shell.js"></script>
<script type="module" src="../assets/js/quizzes/quizzes-page.js"></script>
</head>
<!-- Quiz o'yini o'zgarmagan: quiz.html?id=N (N=0 — aralash quiz), js/quiz-engine.js, data/mavzu-N.json -->
<body class="of-ui" data-shell-title="Quizlar" data-shell-public="true">
<div class="of-page of-container of-cat" id="quizzesPage">
  <header class="of-cat-head">
    <div>
      <h1>Quizlar</h1>
      <p>Mavzuni tanlang va bilimingizni tezkor savollar bilan sinab ko‘ring. Har bir savolga 15 soniya beriladi.</p>
    </div>
    <p class="of-cat-count" data-quiz-count aria-live="polite"></p>
  </header>

  <article class="of-card of-quiz-featured" data-search-item data-search-text="umumiy fizika aralash quiz barcha mavzulardan">
    <span class="of-quiz-featured__icon" data-icon="shuffle"></span>
    <div class="of-quiz-featured__body">
      <h2>Umumiy fizika — aralash quiz</h2>
      <p data-mixed-meta>Barcha mavzulardan tasodifiy savollar.</p>
    </div>
    <a class="of-btn of-btn--primary" href="quiz.html?id=0" data-quiz-start>Boshlash <span data-icon="arrowRight"></span></a>
  </article>

  <section aria-labelledby="quizListTitle">
    <h2 class="of-sr-only" id="quizListTitle">Mavzular bo‘yicha quizlar</h2>
    <ul class="of-chips" data-chips role="group" aria-label="Bo‘lim bo‘yicha saralash"></ul>
    <ul class="of-quiz-grid" data-quizzes aria-busy="true" style="margin-top:12px">
      <li><div class="of-card of-quiz"><span class="of-skeleton of-skeleton--title"></span><span class="of-skeleton of-skeleton--text"></span></div></li>
      <li><div class="of-card of-quiz"><span class="of-skeleton of-skeleton--title"></span><span class="of-skeleton of-skeleton--text"></span></div></li>
      <li><div class="of-card of-quiz"><span class="of-skeleton of-skeleton--title"></span><span class="of-skeleton of-skeleton--text"></span></div></li>
    </ul>
  </section>
</div>
</body>
</html>
