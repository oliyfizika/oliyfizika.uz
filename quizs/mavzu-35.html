<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 35 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Termodinamikaning II qonuni
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Termodinamikaning ikkinchi qonuni issiqlik jarayonlarining qaysi xususiyatini ko'rsatib beradi?",
a:["Energiyaning saqlanishini","Jarayonlarning yo'nalishini","Bosimning o'zgarishini","Modda miqdorini"],
c:1
},

{
q:"'Issiqlik o‘z-o’zidan harorati past jismdan harorati yuqori jismga o’tmaydi'. Bu termodinamikaning 2-qonuniga berilgan qaysi olimning ta’rifi?",
a:["Plank","Karno","Klauzis","Kelvin"],
c:2
},

{
q:"'Tabiatda issiqlik miqdori to’laligicha ishga aylanadigan jarayon bo’lishi mumkin emas'. Bu ta’rif qaysi olimga tegishli?",
a:["Nyuton","Plank","Bolsman","Amper"],
c:1
},

{
q:"Qaysi qonun ikkinchi tur abadiy dvigatel (perpetuum mobile) yasab bo'lmasligini ko'rsatadi?",
a:["Nyutonning birinchi qonuni","Termodinamikaning birinchi qonuni","Termodinamikaning ikkinchi qonuni","Guk qonuni"],
c:2
},

{
q:"Ikkinchi tur 'perpetuum mobile' nima?",
a:["Hech qanday energiya sarflamasdan ish bajaradigan mashina","Okean suvlarining sovishidan ajralgan energiyani ishga aylantirish g'oyasiga asoslangan mashina","Faqat issiqlik yutuvchi qurilma","Vakuumda ishlaydigan dvigatel"],
c:1
},

{
q:"Ideal issiqlik mashinasining FIK i faqat isitkich va sovutkich temperaturalariga bog'liqligini kim ta’riflagan?",
a:["Kelvin","Klauzis","Karno","Mendeleyev"],
c:2
},

{
q:"Issiqlik sovuqroq tizimdan issiqroq tizimga qanday holda uzatilishi mumkin?",
a:["Hech qachon mumkin emas","O'z-o'zidan (tabiiy ravishda)","Tizimda yoki atrofdagi jismlarda o'zgarish (ish) bajarilganda","Faqat vakuum sharoitida"],
c:2
},

{
q:"Karno sikli qanday jarayonlardan tashkil topgan?",
a:["Ikki izobara va ikki izoterma","Ikki izoxora va ikki adiabata","Ikki izoterma va ikki adiabata","To'rtta izobarik jarayon"],
c:2
},

{
q:"Karnoning ideal dvigateli isitkichdan 30 kJ issiqlik olib, 25 kJ ish bajardi. Sovutkichga qancha issiqlik berilgan (kJ)?",
a:["5 kJ","55 kJ","15 kJ","30 kJ"],
c:0
},

{
q:"Issiqlik mashinasining foydali ish koeffitsiyenti (η) qaysi formula bilan aniqlanadi?",
a:["η = (Q1 + Q2) / Q1","η = (Q1 - Q2) / Q1","η = Q2 / Q1","η = T1 / T2"],
c:1
},

{
q:"Karno sikli bo'yicha ishlovchi issiqlik mashinasi FIK i 60% va sovutkich temperaturasi 280 K bo'lsa, isitkich temperaturasi qancha (K)?",
a:["500 K","700 K","600 K","400 K"],
c:1
},

{
q:"Tabiatda issiqlik har doim o'z-o'zidan qanday yo'nalishda uzatiladi?",
a:["Past haroratdan yuqori haroratga","Yuqori haroratdan past haroratga","Faqat bir xil temperaturali jismlar orasida","O'zgarmas hajmda"],
c:1
},

{
q:"Karno sikli bo'yicha ishlovchi mashinada isitkich temperaturasi o'zgarmay, sovutkich temperaturasi oshirilsa, uning FIK i va bajargan ishi qanday o'zgaradi?",
a:["Oshadi","O'zgarmaydi","Kamayadi","Nolga tenglashadi"],
c:2
},

{
q:"Qaysi turdagi issiqlik mashinalari teskari siklda (soat strelkasiga qarshi) ishlaydi?",
a:["Ichki yonuv dvigatellari","Bug' turbinalari","Sovitgich mashinalari","Reaktiv dvigatellar"],
c:2
},

{
q:"Dvigatelning ishchi jismi (gaz) bir sikl davomida isitkichdan Q1 issiqlik oladi va sovutkichga Q2 issiqlik beradi. Bunda gazning ichki energiyasi o'zgarishi (ΔU) nimaga teng?",
a:["ΔU = Q1 - Q2","ΔU = Q1 + Q2","ΔU = 0","ΔU = A"],
c:2
},

{
q:"Karnoning ideal dvigateli 600 K temperaturali isitkichdan 20 kJ issiqlik olib, sovutkichga 11 kJ issiqlik berdi. Sovutkich temperaturasi qancha (K)?",
a:["300 K","330 K","450 K","480 K"],
c:1
},

{
q:"Termodinamikaning ikkinchi qonuni birinchi bo'lib kim tomonidan ishlab chiqilgan?",
a:["G. Galiley","I. Nyuton","R. Klauzius","V. Nernst"],
c:2
},

{
q:"Real issiqlik mashinasi isitgichdan 2 kJ issiqlik olib, sovutgichga 600 J issiqlik berdi. Uning FIK i necha foiz?",
a:["30%","70%","60%","40%"],
c:1
},

{
q:"Dizel dvigatelida yoqilg'ining yonishi qanday jarayonda sodir bo'ladi?",
a:["O'zgarmas hajmda","O'zgarmas bosimda","O'zgarmas temperaturada","Adiabatik jarayonda"],
c:1
},

{
q:"Karburatorli dvigatellarda yoqilg'ining yonishi qanday jarayonda ro'y beradi?",
a:["O'zgarmas bosimda","O'zgarmas hajmda","Izotermik jarayonda","Adiabatik kengayishda"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
