<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 37 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Elektr maydon
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Elektr maydonning manbasini ko‘rsating.",
a:["Neytronlar","Massiv jismlar","Elektr zaryadlar","Doimiy magnitlar"],
c:2
},

{
q:"Elektr maydon kuchlanganligining to‘g‘ri va to‘la ta’rifini ko‘rsating.",
a:["Maydon kuchlanganligi – shu nuqtadagi birlik musbat zaryadga ta’sir qiluvchi kuchga son jihatidan teng bo‘lgan vektor kattalik","Kuchlanganlik – maydonning energetik xarakteristikasidir","Kuchlanganlik – zaryadning potensial energiyasini aniqlaydi","Kuchlanganlik – maydonning skalar xarakteristikasidir"],
c:0
},

{
q:"Vakuumdagi nuqtaviy zaryadning o‘zidan r masofada hosil qiladigan elektr maydoni kuchlanganligi qaysi formula bilan aniqlanadi?",
a:["E = F·q","E = k·q/r²","E = U/d²","E = A/q"],
c:1
},

{
q:"Elektr maydon kuchlanganligi qanday birlikda o‘lchanadi?",
a:["V/m (yoki N/C)","J/C","Farada (F)","Pa·m"],
c:0
},

{
q:"Elektr maydon kuchlanganligi vektori qanday yo‘nalgan bo‘ladi?",
a:["Faqat musbat zaryadga qarab","Potensial kamayishi tomoniga","Potensial ortishi tomoniga","Ekvipotensial sirt bo'ylab"],
c:1
},

{
q:"Barcha nuqtalarida kuchlanganlik vektori o‘zgarmas bo‘lgan elektr maydoni qanday ataladi?",
a:["Uyurmali maydon","O'zgaruvchan maydon","Bir jinsli elektr maydon","Garmonik maydon"],
c:2
},

{
q:"Elektr jihatdan yaxshi o‘tkazgich ichidagi elektr maydon kuchlanganligi (E) va potensiali (φ) uchun qaysi tasdiq to‘g‘ri?",
a:["E = 0, φ = const","E = const, φ = 0","E ≠ 0, φ = 0","E = 0, φ = 0"],
c:0
},

{
q:"Vakuumda turgan nuqtaviy zaryadning ekvipotensial sirtlari qanday shaklda bo‘ladi?",
a:["Silindr","Tekislik","Sfera (konsentrik aylanalar)","Konus"],
c:2
},

{
q:"Zaryadni ekvipotensial sirt bo‘ylab ko‘chirishda elektr maydon kuchlari qancha ish bajaradi?",
a:["Maksimal ish","Nolga teng ish","Zaryad miqdoriga teng ish","Sirt yuzasiga bog'liq"],
c:1
},

{
q:"Elektr maydon kuchlanganligi (E) va potensiallar ayirmasi (U) orasidagi bog‘lanish formulasini ko‘rsating.",
a:["E = U/d","E = U·d","E = F/U","E = qU"],
c:0
},

{
q:"Elektr maydonning berilgan nuqtadagi potensiali deb nimaga aytiladi?",
a:["Maydonning kuch xarakteristikasiga","Birlik musbat zaryadning shu nuqtadagi potensial energiyasiga teng skalar kattalikka","Zaryadga ta'sir etuvchi kuchga","Maydonning energiya zichligiga"],
c:1
},

{
q:"Bir jinsli elektr maydonning ishi (A) qaysi formula bilan aniqlanadi?",
a:["A = qEd cosα","A = F/E","A = k q1 q2 / r","A = E / q"],
c:0
},

{
q:"O‘tkazgichga berilgan zaryad uning qayerida joylashadi?",
a:["Faqat markazida","Butun hajmi bo'ylab tekis","O'tkazgichning sirti bo'ylab","Faqat burchaklarida"],
c:2
},

{
q:"Quyidagi qaysi qatorda faqat skalar fizik kattaliklar keltirilgan?",
a:["Tok kuchi, kuchlanish, zaryad","Kuchlanganlik, potensial, zaryad","Elektr kuchi, potensial, tok zichligi","Tok zichligi, EYK, zaryad"],
c:0
},

{
q:"Dielektrik singdiruvchanligi ε bo'lgan muhitga kiritilgan nuqtaviy zaryadning maydon kuchlanganligi vakuumdagiga nisbatan qanday o'zgaradi?",
a:["ε marta ortadi","ε marta kamayadi","O'zgarmaydi","ε² marta kamayadi"],
c:1
},

{
q:"Nuqtaviy zaryad maydonida potensial 5 marta kamayadigan masofada, kuchlanganlik necha marta kamayadi?",
a:["5 marta","10 marta","25 marta","O'zgarmaydi"],
c:2
},

{
q:"Elektr maydon energiya zichligi (w) formulasi qaysi javobda to'g'ri?",
a:["w = ε ε0 E² / 2","w = q E d","w = U / d","w = C U² / 2"],
c:0
},

{
q:"O'tkazgichning elektr sig'imi (C) nimalarga bog'liq?",
a:["Faqat unga berilgan zaryadga","Faqat uning potensialiga","O'tkazgichning shakli, o'lchami va atrofidagi muhitga","Tashqi elektr maydon kuchiga"],
c:2
},

{
q:"Musbat zaryadlangan sharcha bir jinsli elektr maydonda vertikaldan o‘ng tomonga og‘sa, maydon kuch chiziqlari qaysi tomonga yo‘nalgan?",
a:["Pastga","Yuqoriga","O'ngga","Chapga"],
c:2
},

{
q:"Ikki nuqta orasidagi potensiallar farqi 100 V. Shu nuqtalar orasida 2 µC zaryad ko'chganda maydon kuchlari necha J ish bajaradi?",
a:["200 J","0,2 mJ","2 mJ","50 mJ"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
