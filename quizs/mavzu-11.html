<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 11 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Ishqalanish kuchi
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Jismlarning bir-biriga tegib turgan yuzalari orasida paydo bo'ladigan va harakatga qarshilik qiladigan kuch nima?",
a:["Og'irlik kuchi","Ishqalanish kuchi","Elastiklik kuchi","Arximed kuchi"],
c:1
},

{
q:"Qaysi kuchning bajargan ishi trayektoriya shakliga bog'liq?",
a:["Og'irlik kuchi","Elektr maydon kuchi","Ishqalanish kuchi","Elastiklik kuchi"],
c:2
},

{
q:"Ishqalanish kuchi odatda qanday ish bajaradi?",
a:["Musbat","Manfiy","Nol","Hech qanday"],
c:1
},

{
q:"Tashqi ishqalanish kuchi necha turga bo'linadi?",
a:["2 turga","3 turga","4 turga","5 turga"],
c:1
},

{
q:"Ishqalanish koeffitsiyenti (μ) quyidagilarning qaysi biriga bog'liq emas?",
a:["Modda turiga","Sirtning silliqligiga","Yuzaning geometrik o'lchamiga","Temperaturaga"],
c:2
},

{
q:"Jismning turli qismlari (qatlamlari) orasida yuzaga keladigan ishqalanish nima deyiladi?",
a:["Tashqi ishqalanish","Ichki ishqalanish","Static ishqalanish","Sirpanish ishqalanish"],
c:1
},

{
q:"Ishqalanish kuchining bajargan ishi natijasida mexanik energiya nimaga aylanadi?",
a:["Potensial energiyaga","Kinetik energiyaga","Ichki energiyaga (issiqlikka)","Yadro energiyasiga"],
c:2
},

{
q:"Dumalanish ishqalanishining asosiy sababi nima?",
a:["Jism og'irligi","Sirt deformatsiyasi","Tezlik ortishi","Havo qarshiligi"],
c:1
},

{
q:"Ishqalanish kuchi jism harakat yo'nalishiga nisbatan qanday yo'naladi?",
a:["Harakat yo'nalishida","Harakatga perpendikulyar","Harakatga qarama-qarshi","Pastga qarab"],
c:2
},

{
q:"Jism endi joyidan qo'zg'alish arafasida bo'lganda qaysi ishqalanish kuchi maksimal qiymatga ega bo'ladi?",
a:["Sirpanish ishqalanish","Dumalanish ishqalanish","Tinchlikdagi ishqalanish","Ichki ishqalanish"],
c:2
},

{
q:"Sirtlar qanchalik silliq bo'lsa, ishqalanish kuchi qanday o'zgaradi?",
a:["Ortadi","O'zgarmaydi","Kamayadi","Cheksiz ortadi"],
c:2
},

{
q:"Ishqalanish kuchi normal bosim kuchiga qanday bog'langan?",
a:["Teskari proporsional","Kvadratik bog'liq","To'g'ri proporsional","Bog'liq emas"],
c:2
},

{
q:"Ishqalanish koeffitsiyentining birligi nima?",
a:["Nyuton","Metr","Paskal","O'lchov birligiga ega emas"],
c:3
},

{
q:"Tinch turgan jismni joyidan qo'zg'atishga to'sqinlik qiluvchi kuch nima?",
a:["Tinchlikdagi ishqalanish","Sirpanish ishqalanish","Og'irlik kuchi","Dumalanish ishqalanish"],
c:0
},

{
q:"Ishqalanish kuchini qaysi asbob yordamida o'lchash mumkin?",
a:["Spidometr","Dinamometr","Termometr","Barometr"],
c:1
},

{
q:"Ichki ishqalanish kuchi asosan qayerda mavjud bo'ladi?",
a:["Faqat qattiq jismlarda","Suyuqlik va gazlarda","Vakuumda","Hech qayerda"],
c:1
},

{
q:"Dumalanish ishqalanish kuchi sirpanish ishqalanish kuchidan odatda qanday farq qiladi?",
a:["Kattaroq bo'ladi","Teng bo'ladi","Ancha kichik bo'ladi","Farq qilmaydi"],
c:2
},

{
q:"Bajargan ishi trayektoriya shakliga bog'liq bo'lmagan kuchlar nima deyiladi?",
a:["Dissipativ kuchlar","Konservativ kuchlar","Ishqalanish kuchlari","Havo qarshiligi"],
c:1
},

{
q:"Berk trayektoriya (yopiq yo'l) bo'ylab ishqalanish kuchining to'la ishi nimaga teng?",
a:["Nolga","Noldan farqli manfiy qiymatga","Massaga","Tezlikka"],
c:1
},

{
q:"Suyuqliklarda temperatura ortishi bilan ichki ishqalanish kuchi (yopishqoqlik) qanday o'zgaradi?",
a:["Ortadi","Kamayadi","O'zgarmaydi","Nolga tenglashadi"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
