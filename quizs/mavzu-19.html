<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 19 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Bosim. Paskal qonuni
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Sirtning birlik yuzasiga ta’sir qiluvchi kuch nima deyiladi?",
a:["Massa","Tezlanish","Bosim","Energiya"],
c:2
},

{
q:"Bosimning Xalqaro birliklar sistemasi (XBS) dagi birligi nima?",
a:["Joul","Nyuton","Paskal (Pa)","Vatt"],
c:2
},

{
q:"Suyuqlik yoki gazga berilgan bosim barcha yo’nalishda bir xil va o’zgarishsiz uzatiladi. Bu qaysi qonun?",
a:["Nyuton qonuni","Paskal qonuni","Guk qonuni","Arximed qonuni"],
c:1
},

{
q:"Gidrostatik bosim (suyuqlikning idish tubiga bosimi) qaysi formula bilan aniqlanadi?",
a:["P = F / S","P = ρgh","P = mg","P = mv² / 2"],
c:1
},

{
q:"Atmosfera bosimini birinchi bo’lib o’lchagan olim kim?",
a:["I. Nyuton","G. Galiley","E. Torrichelli","B. Paskal"],
c:2
},

{
q:"Dengiz sathidan har necha metr balandlikka ko’tarilganda atmosfera bosimi 1 mm.sim.ust. ga kamayadi?",
a:["10 m","12 m","100 m","5 m"],
c:1
},

{
q:"Berk idishdagi gaz yoki suyuqlik bosimini o’lchaydigan asbob nima?",
a:["Barometr","Manometr","Termometr","Spidometr"],
c:1
},

{
q:"Gidravlik pressning ishlash prinsipi qaysi qonun va qoidaga asoslangan?",
a:["Faqat Nyuton qonuniga","Paskal qonuni va mexanikaning oltin qoidasiga","Faqat Guk qonuniga","Arximed qonuniga"],
c:1
},

{
q:"Atmosfera bosimini o'lchash uchun ishlatiladigan asboblar qanday ataladi?",
a:["Barometr yoki aneroid","Manometr","Dinamometr","Akselerometr"],
c:0
},

{
q:"Balandlikni bosim o’zgarishiga qarab o’lchaydigan asbob nima?",
a:["Termometr","Altimetr","Gigrometr","Vattmetr"],
c:1
},

{
q:"Suyuqlik vaznining suyuqlikning idish tubiga ko’rsatuvchi bosim kuchidan farq qilish hodisasi nima deyiladi?",
a:["Gidrostatik paradoks","Inersiya hodisasi","Vaznsizlik","Reaktiv harakat"],
c:0
},

{
q:"Nima uchun atmosfera bosimini P = ρgh formulasi bilan aniq hisoblab bo’lmaydi?",
a:["Havo zichligi balandlik ortishi bilan kamayishi va atmosferaning aniq chegarasi yo'qligi sababli","Havo massasi yo'qligi uchun","Yer aylanishi tufayli","Gravitatsiya doimiysi o'zgargani uchun"],
c:0
},

{
q:"Normal atmosfera bosimi o'rtacha necha mm simob ustuniga teng deb qabul qilingan?",
a:["700 mm","760 mm","100 mm","1000 mm"],
c:1
},

{
q:"Suyuqlikning idish tubiga beradigan gidrostatik bosimi nimalarga bog'liq?",
a:["Faqat idish shakliga","Suyuqlik zichligi, erkin tushish tezlanishi va balandlikka","Faqat jism massasiga","Havo haroratiga"],
c:1
},

{
q:"Bosim (P) va sirt yuzasi (S) orasidagi bog'liqlik qanday?",
a:["To'g'ri proporsional","Teskari proporsional","Bog'liq emas","Kvadratik bog'liq"],
c:1
},

{
q:"1 Paskal bosimga berilgan to'g'ri ta'rif qaysi?",
a:["1 m² yuzaga 1 N kuch tik ta'sir etgandagi bosim","10 kg massali jism bosimi","Suvning 1 m chuqurlikdagi bosimi","Atmosferaning dengiz sathidagi bosimi"],
c:0
},

{
q:"Suyuqliklarda bosim qaysi yo'nalishlarda uzatiladi?",
a:["Faqat pastga","Faqat yon tomonga","Barcha yo'nalishlarda bir xilda","Faqat yuqoriga"],
c:2
},

{
q:"Gidravlik press nimalardan tashkil topgan?",
a:["Bitta silindr va bitta porshen","Diametrlari har xil bo'lgan, o'zaro tutashgan ikki silindr va porshenlar","Faqat prujinalar","Aylanuvchi disklar"],
c:1
},

{
q:"Gidrostatik bosim suyuqlik ustuni balandligiga qanday bog'langan?",
a:["Teskari proporsional","To'g'ri proporsional","Kvadratik bog'liq","Bog'liq emas"],
c:1
},

{
q:"Simobli barometr balanddan erkin tushayotgan bo'lsa (vaznsizlikda), barometr nayidagi simob ustunida qanday o'zgarish bo'ladi?",
a:["Pastga tushadi","O'zgarmaydi","Simob kapilliyarni to'ldiradi","Nolga tenglashadi"],
c:2
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
