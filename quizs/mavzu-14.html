<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Impulsning saqlanish qonuni
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Jism massasining uning tezligiga ko'paytmasi nima deb ataladi?",
a:["Kuch impulsi","Jism impulsi (harakat miqdori)","Energiya","Inertlik"],
c:1
},

{
q:"Jism impulsining (harakat miqdorining) XBS dagi birligi qaysi?",
a:["1 N·m","1 kg·m/s","1 Joul","1 kg/m³"],
c:1
},

{
q:"Jismga ta'sir etuvchi kuchning uning ta'sir qilish vaqtiga ko'paytmasi nima deyiladi?",
a:["Ish","Quvvat","Kuch impulsi","Bosim"],
c:2
},

{
q:"Kuch impulsi nimaga teng?",
a:["Tezlikka","Massa o'zgarishiga","Harakat miqdori (impuls)ning o'zgarishiga","Potensial energiyaga"],
c:2
},

{
q:"Tashqi kuchlar ta'sir etmaydigan jism yoki jismlar sistemasi nima deyiladi?",
a:["Inersial sistema","Ochiq sistema","Yopiq (berk) sistema","Absolyut sistema"],
c:2
},

{
q:"Impulsning saqlanish qonuni qanday ta'riflanadi?",
a:["Tashqi kuchlar ta'sirida impuls ortadi","Berk sistemadagi jismlar impulslarining vektorial yig'indisi o'zgarmaydi","To'qnashuvda jami energiya yo'qoladi","Impuls tezlikka teskari proporsional"],
c:1
},

{
q:"Impulsning saqlanish qonuni fazoning qaysi xossasi natijasidir?",
a:["Izotropligi","Cheksizligi","Bir jinsliligi","Zichligi"],
c:2
},

{
q:"Fazoning bir jinsliligi nima degani?",
a:["Barcha yo'nalishlar teng kuchliligi","Fazoning barcha nuqtalari teng kuchliligi (fizik jarayonlar bir xil kechishi)","Fazo va vaqtning bog'liqligi","Fazoning faqat markazida kuch mavjudligi"],
c:1
},

{
q:"Jismdan uning bir qismi ma'lum tezlik bilan ajralib chiqishi natijasida jismning qarama-qarshi tomonga harakatlanishi nima deyiladi?",
a:["Erkin harakat","Nisbiy harakat","Reaktiv harakat","Ilgarilanma harakat"],
c:2
},

{
q:"Reaktiv harakat qaysi qonun asosida ro'y beradi?",
a:["Guk qonuni","Impulsning saqlanish qonuni","Paskal qonuni","Arximed qonuni"],
c:1
},

{
q:"Absolyut noelastik urilishda qaysi qonun bajariladi va qaysi biri bajarilmaydi?",
a:["Impuls saqlanadi, energiya saqlanmaydi","Energiya saqlanadi, impuls saqlanmaydi","Ikkala qonun ham bajariladi","Hech biri bajarilmaydi"],
c:0
},

{
q:"Absolyut elastik urilishda qaysi kattaliklar saqlanadi?",
a:["Faqat massa","Faqat tezlik","Ham impuls, ham mexanik energiya","Faqat kuch"],
c:2
},

{
q:"Jism impulsining yo'nalishi har doim qaysi kattalik yo'nalishi bilan mos tushadi?",
a:["Kuch","Tezlanish","Tezlik","Vaqt"],
c:2
},

{
q:"Miltiqdan o'q otilganda miltiqning orqaga tepishi nima bilan tushuntiriladi?",
a:["Havoning qarshiligi bilan","Impulsning saqlanish qonuni bilan","Og'irlik kuchi bilan","Ishqalanish kuchi bilan"],
c:1
},

{
q:"Agar jismning massasi 2 marta ortsa, uning impulsi qanday o'zgaradi?",
a:["2 marta kamayadi","4 marta ortadi","2 marta ortadi","O'zgarmaydi"],
c:2
},

{
q:"Kuch impulsining birligi jism impulsi birligi bilan bir xilmi?",
a:["Yo'q, ular butunlay farq qiladi","Ha, ikkalasi ham 1 kg·m/s (yoki N·s) ga teng","Faqat vakuumda bir xil","Faqat statikada bir xil"],
c:1
},

{
q:"Reaktiv dvigatellar va raketalar uchish nazariyasini birinchi bo'lib kim ishlab chiqqan?",
a:["I. Nyuton","K.E. Siolkovskiy","A. Eynshteyn","G. Galiley"],
c:1
},

{
q:"Jismga ta'sir etuvchi kuchlar natijaviysi nolga teng bo'lsa, jism impulsida qanday o'zgarish bo'ladi?",
a:["Keskin ortadi","Nolgacha kamayadi","O'zgarmas qoladi (P=const)","Yo'nalishi o'zgaradi"],
c:2
},

{
q:"Ikki jism to'qnashuvidan so'ng birgalikda (yopishgan holda) harakat qilsa, bu qanday urilish?",
a:["Absolyut elastik","Absolyut noelastik","Erkin urilish","Markaziy urilish"],
c:1
},

{
q:"Harakat miqdori momenti (impuls momenti)ning saqlanishi fazoning qaysi xossasi natijasi?",
a:["Bir jinsliligi","Izotropligi","Vaqtning bir jinsliligi","Egriligi"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
