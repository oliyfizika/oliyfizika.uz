<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 10 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Gorizontal va burchak ostida otilgan jism
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Jism bir vaqtning o'zida ham tekis harakatda, ham tekis o'zgaruvchan harakatda ishtirok etsa, uning trayektoriyasi qanday shaklda bo'ladi?",
a:["Aylana","To'g'ri chiziq","Parabola","Giperbola"],
c:2
},

{
q:"Gorizontal otilgan jismning gorizontal (X o'qi) bo'ylab harakati qanday turga kiradi?",
a:["To'g'ri chiziqli tekis harakat","Tekis tezlanuvchan harakat","Tekis sekinlanuvchan harakat","Aylanma harakat"],
c:0
},

{
q:"Gorizontal otilgan jismning vertikal (Y o'qi) bo'ylab harakati qanday tavsiflanadi?",
a:["To'g'ri chiziqli tekis harakat","Tekis tezlanuvchan (erkin tushish)","O'zgarmas tezlikli harakat","Tinch holat"],
c:1
},

{
q:"Gorizontal otilgan jismning ixtiyoriy vaqtdagi natijaviy (oniy) tezligi qaysi formula bilan aniqlanadi?",
a:["v = v0 + gt","v = sqrt(v0^2 + (gt)^2)","v = v0 - gt","v = gt"],
c:1
},

{
q:"Gorizontga burchak ostida otilgan jismning tezligi trayektoriyaning qaysi nuqtasida minimal bo'ladi?",
a:["Otilish nuqtasida","Yerga tushish momentida","Eng yuqori nuqtaga ko'tarilganda","Hech qachon minimal bo'lmaydi"],
c:2
},

{
q:"Gorizontga burchak ostida otilgan jismning gorizontal tezlik tashkil etuvchisi (vx) harakat davomida qanday o'zgaradi?",
a:["Vaqt o'tishi bilan ortadi","Vaqt o'tishi bilan kamayadi","O'zgarmas qoladi (vx = const)","Nolga tenglashadi"],
c:2
},

{
q:"Gorizontga burchak ostida otilgan jismning vertikal tezlik tashkil etuvchisi (vy) uchun to'g'ri formulani ko'rsating.",
a:["vy = v0 * cosα","vy = v0 * sinα - gt","vy = gt","vy = v0 * tanα"],
c:1
},

{
q:"Gorizontal otilgan jismning tushish vaqti (t) asosan nimaga bog'liq?",
a:["Boshlang'ich tezlikka (v0)","Jismning massasiga","Boshlang'ich balandlikka (h)","Jismning shakliga"],
c:2
},

{
q:"Gorizontga burchak ostida otilgan jism trayektoriyasining eng yuqori nuqtasida uning vertikal tezligi (vy) nimaga teng?",
a:["Boshlang'ich tezlikka (v0) ga","Erkin tushish tezlanishiga (g) ga","Nolga","v0 * sinα ga"],
c:2
},

{
q:"Egri chiziqli harakatda oniy tezlik vektori trayektoriyaga nisbatan qanday yo'naladi?",
a:["Normal (tik) bo'ylab","Markazga qarab","Trayektoriyaga o'tkazilgan urinma bo'ylab","Ixtiyoriy yo'nalishda"],
c:2
},

{
q:"Gorizontal otilgan jismning uchish uzoqligi (S) qanday topiladi?",
a:["S = v0 * t","S = gt^2 / 2","S = v0 / t","S = v^2 / 2g"],
c:0
},

{
q:"Erkin tushish tezlanishi (g) Yer qutblarida qanday qiymatga ega?",
a:["9,78 m/s²","9,81 m/s²","9,83 m/s²","10 m/s²"],
c:2
},

{
q:"Erkin tushish tezlanishi Yer ekvatorida taxminan qanchaga teng?",
a:["9,83 m/s²","9,81 m/s²","9,78 m/s²","9,75 m/s²"],
c:2
},

{
q:"Jism bir vaqtda bir nechta harakatda ishtirok etsa, bu harakatlar bir-biriga to'sqinlik qilmasligi qanday ataladi?",
a:["Nisbiylik prinsipi","Harakatning mustaqillik qonuni (prinsipi)","Inersiya qonuni","Energiya saqlanish qonuni"],
c:1
},

{
q:"Gorizontga burchak ostida otilgan jismning eng yuqori nuqtasidagi to'la tezligi nimaga teng?",
a:["Nolga","Faqat gorizontal tashkil etuvchiga (v0 * cosα)","Faqat vertikal tashkil etuvchiga (v0 * sinα)","Boshlang'ich tezlik (v0) ga"],
c:1
},

{
q:"Jismning h balandlikdan boshlang'ich tezliksiz (v0=0) tushish vaqti qaysi formula bilan aniqlanadi?",
a:["t = h / g","t = sqrt(2h / g)","t = v / g","t = 2h / g"],
c:1
},

{
q:"Gorizontga burchak ostida otilgan jismning trayektoriya shakli qanday bo'ladi?",
a:["To'g'ri chiziq","Aylana yoyi","Parabola","Sinusoida"],
c:2
},

{
q:"Qaysi turdagi harakat har doim tezlanishli bo'ladi?",
a:["To'g'ri chiziqli tekis harakat","Egri chiziqli harakat","Tinch holatdagi jism harakati","Hech biri"],
c:1
},

{
q:"Gorizontal otilgan jismning tushish balandligi (h) va vaqti (t) orasidagi bog'lanish (v0y=0 bo'lganda) qanday?",
a:["h = gt^2 / 2","h = v0 * t","h = gt","h = v^2 / g"],
c:0
},

{
q:"Trayektoriyasining shakliga qarab mexanik harakat necha asosiy turga bo'linadi?",
a:["3 turga","2 turga: egri va to'g'ri chiziqli","4 turga","Faqat bir turga"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
