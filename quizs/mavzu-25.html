<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 25 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Molekulyar kinetik nazariya
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Molekulyar-kinetik nazariyaning asosiy qoidalari qaysi javobda to'liq bayon qilingan?",
a:["Modda mayda bo'laklardan tuziladi va ular fazoni uzluksiz to'ldiradi","Har qanday jism molekulalardan tuzilgan, ular betartib harakatda bo'ladi va ular orasida o'zaro ta'sir kuchlari mavjud","Modda elementar zarralardan tuziladi va ular bir-biriga tinimsiz aylanib turadi","Barcha moddalar faqat elektron va protonlardan iborat"],
c:1
},

{
q:"Modda miqdorining Xalqaro birliklar sistemasi (XBS) dagi asosiy birligi nima?",
a:["Kilogramm (kg)","Massa atom birligi (m.a.b)","Mol (mol)","Gramm/mol (g/mol)"],
c:2
},

{
q:"Avogadro doimiysi ($N_A$) ning qiymati qanchaga teng?",
a:["$1,38 \cdot 10^{-23} \text{ J/K}$","$6,02 \cdot 10^{23} \text{ mol}^{-1}$","$8,31 \cdot 10^{23} \text{ J/(mol·K)}$","$6,62 \cdot 10^{-34} \text{ J·s}$"],
c:1
},

{
q:"Molyar massa deb nimaga aytiladi?",
a:["$1 \text{ m}^3$ hajmdagi modda massasiga","$N_A$ ta zarrachadan tashkil topgan modda massasiga","Bitta molekulaning grammlarda ifodalangan massasiga","Molekula massasining vodorod atomi massasiga nisbatiga"],
c:1
},

{
q:"Gaz nima sababli idish devorlariga bosim bilan ta'sir etadi?",
a:["Molekulalarning o'zaro tortilishi sababli","Molekulalarning idish devorlariga kelib urilishi natijasida","Gazning og'irligi sababli","Molekulalar o'lchamining kattaligi tufayli"],
c:1
},

{
q:"Molekulyar-kinetik nazariyaning asosiy tenglamasini ko'rsating.",
a:["$P = 2/3 nE_k$","$P = m/V$","$P = F/S$","$PV = const$"],
c:0
},

{
q:"Temperaturaning (haroratning) fizik ma'nosi nima?",
a:["Modda zichligining o'lchovi","Molekulalar sonining o'lchovi","Molekulalar o'rtacha kinetik energiyasining o'lchovi","Jism hajmining o'lchovi"],
c:2
},

{
q:"Bitta molekulaning ilgarilanma harakat o'rtacha kinetik energiyasi ($E_k$) qaysi formula bilan aniqlanadi?",
a:["$E_k = 1/2 kT$","$E_k = 3/2 kT$","$E_k = 3/2 RT$","$E_k = nkT$"],
c:1
},

{
q:"Bolsman doimiysi ($k$) ning qiymati va ma'nosi qaysi javobda to'g'ri berilgan?",
a:["$1,38 \cdot 10^{-23} \text{ J/K}$; temperatura va energiya orasidagi bog'liqlik koeffitsiyenti","$8,31 \text{ J/(mol·K)}$; gazning bir moli bajargan ishi","$6,02 \cdot 10^{23} \text{ mol}^{-1}$; zarrachalar soni","$1,6 \cdot 10^{-19} \text{ C}$; elektron zaryadi"],
c:0
},

{
q:"Suyuqlik yoki gazga solingan mayda zarralarning molekulalar zarbi natijasida tartibsiz harakatlanishi nima deyiladi?",
a:["Diffuziya","Broun harakati","Konveksiya","Depozitsiya"],
c:1
},

{
q:"Gazni 'ideal' deb hisoblash uchun qaysi shart bajarilishi kerak?",
a:["Molekulalarning harakatini hisobga olmaslik","Molekulalarning faqat massasini hisobga olish","Molekulalarning masofadan o'zaro ta'sirini va ularning o'lchamlarini e'tiborga olmaslik","Gazni juda yuqori bosimda saqlash"],
c:2
},

{
q:"Mendeleev-Klapeyron tenglamasining (ideal gaz holat tenglamasi) ko'rinishini aniqlang.",
a:["$P = nkT$","$PV = m/M RT$","$V/T = const$","$P_1V_1 = P_2V_2$"],
c:1
},

{
q:"Gaz molekulalarining o'rtacha kvadratik tezligi qaysi formula bilan topiladi?",
a:["$v = \sqrt{3kT/m_0}$","$v = 3/2 kT$","$v = \sqrt{2g/h}$","$v = \omega R$"],
c:0
},

{
q:"Hajm birligidagi molekulalar soni ($n = N/V$) nima deb ataladi?",
a:["Zichlik","Modda miqdori","Molekulalar konsentratsiyasi","Avogadro soni"],
c:2
},

{
q:"Idishdagi gazlar aralashmasining umumiy bosimi har bir gazning parsial bosimlari yig'indisiga teng. Bu qaysi qonun?",
a:["Paskal qonuni","Dalton qonuni","Boyl-Mariott qonuni","Shar qonuni"],
c:1
},

{
q:"Universal gaz doimiysi ($R$) ning qiymati nimaga teng?",
a:["$1,38 \text{ J/(K·mol)}$","$8,31 \text{ J/(mol·K)}$","$6,02 \text{ mol}^{-1}$","$22,4 \text{ l/mol}$"],
c:1
},

{
q:"Diffuziya hodisasi qaysi moddalarda kuzatiladi?",
a:["Faqat gazlarda","Faqat suyuqliklarda","Gaz, suyuqlik va qattiq jismlarda","Faqat vakuumda"],
c:2
},

{
q:"Absolyut nol temperatura ($0 \text{ K}$) qanday holatga mos keladi?",
a:["Suvning muzlash haroratiga","Molekulalarning ilgarilanma harakati to'xtaydigan haroratga ($E_k = 0$)","Gazning suyuqlikka aylanish haroratiga","Atmosfera bosimi nolga teng bo'lgan holatga"],
c:1
},

{
q:"$32 \text{ g}$ vodoroddagi modda miqdorini aniqlang ($M = 2 \text{ g/mol}$).",
a:["$16 \text{ mol}$","$32 \text{ mol}$","$64 \text{ mol}$","$1 \text{ mol}$"],
c:0
},

{
q:"Ideal gazning absolut temperaturasi 4 marta ortsa, molekulalarning o'rtacha kvadratik tezligi qanday o'zgaradi?",
a:["4 marta ortadi","2 marta ortadi","O'zgarmaydi","16 marta ortadi"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
