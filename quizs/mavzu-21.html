<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 21 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Arximed kuchi
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Suyuqlik yoki gazlarga to'liq botirilgan jism o'z hajmiga teng miqdordagi suyuqlik yoki gazni siqib chiqarishi qaysi qonunda aytiladi?",
a:["Nyuton qonuni","Paskal qonuni","Arximed qonuni","Guk qonuni"],
c:2
},

{
q:"Arximed kuchi jismga qaysi yo'nalishda ta'sir qiladi?",
a:["Gorizontal","Vertikal pastga","Pastdan yuqoriga qarab","Ixtiyoriy yo'nalishda"],
c:2
},

{
q:"Arximed kuchining matematik ifodasi (formulasi) qaysi?",
a:["Fa = ma","Fa = ρ·g·V","Fa = mg","Fa = P/S"],
c:1
},

{
q:"Arximed kuchi jismning qaysi parametriga bog'liq?",
a:["Massasiga","Zichligiga","Suyuqlikka botgan qismining hajmiga","Shakliga"],
c:2
},

{
q:"Jism suyuqlik ichida muvozanatda (suzib) turishi uchun qanday shart bajarilishi kerak?",
a:["Fa > mg","Fa < mg","Fa = mg","Fa = 0"],
c:2
},

{
q:"Agar jismga ta'sir etuvchi Arximed kuchi uning og'irlik kuchidan kichik bo'lsa (Fa < mg), jism qanday holatda bo'ladi?",
a:["Suzadi","Cho'kadi","Sirtga chiqadi","Tinch turadi"],
c:1
},

{
q:"Jism idishdagi suyuqlik bilan birga erkin tushayotgan bo'lsa (vaznsizlik), unga ta'sir etuvchi itarib chiqaruvchi kuch nimaga teng?",
a:["Maksimal qiymatga","Jism og'irligiga","Nolga","Suyuqlik zichligiga"],
c:2
},

{
q:"Arximed kuchi yana qanday nomlanadi?",
a:["Tortishish kuchi","Itarib chiqaruvchi kuch","Ishqalanish kuchi","Bosim kuchi"],
c:1
},

{
q:"Arximed kuchi suyuqlikning qaysi xossasiga bog'liq?",
a:["Hajmiga","Zichligiga","Rangi va haroratiga","Idish shakliga"],
c:1
},

{
q:"Suv tubida yotgan suvosti kemasiga qaysi kuchlar ta'sir qiladi?",
a:["Faqat og'irlik kuchi","Faqat Arximed kuchi","Og'irlik, Arximed va suvning qarshilik kuchlari","Faqat ishqalanish kuchi"],
c:2
},

{
q:"Havo sharlarining yuqoriga ko'tarilishi nima bilan tushuntiriladi?",
a:["Inersiya bilan","Gazlardagi Arximed kuchi (havoning itarib chiqarish kuchi) bilan","Paskal qonuni bilan","Butun olam tortishish qonuni bilan"],
c:1
},

{
q:"Jismning suyuqlikdagi og'irligi (P1) havodagi og'irligidan (P) qanchaga farq qiladi?",
a:["P1 = P + Fa","P1 = P - Fa","P1 = Fa","P1 = P * Fa"],
c:1
},

{
q:"Arximed kuchi jismning suyuqlikka botish chuqurligiga (to'liq botgan holatda) bog'liqmi?",
a:["Ha, chuqurlashgan sari ortadi","Yo'q, bog'liq emas","Chuqurlashgan sari kamayadi","Faqat dengizlarda bog'liq"],
c:1
},

{
q:"Suyuqlik yuzasida suzib yurgan jism uchun Arximed kuchi nimaga teng?",
a:["Jismning to'la hajmidagi suyuqlik og'irligiga","Jism siqib chiqargan suyuqlik og'irligiga (vazniga)","Nolga","Faqat jism massasiga"],
c:1
},

{
q:"Areometr asbobi nima uchun ishlatiladi?",
a:["Bosimni o'lchash uchun","Suyuqlik zichligini Arximed qonuniga ko'ra aniqlash uchun","Tezlikni o'lchash uchun","Kuchni aniqlash uchun"],
c:1
},

{
q:"Muz suvda suzganda uning qancha qismi suv ostida bo'ladi (ρ_muz = 900 kg/m³, ρ_suv = 1000 kg/m³)?",
a:["10% qismi","50% qismi","90% qismi","Hammasi suv ustida bo'ladi"],
c:2
},

{
q:"Arximed kuchi qaysi muhitlarda mavjud bo'ladi?",
a:["Faqat suyuqliklarda","Faqat gazlarda","Suyuqlik va gazlarda","Vakuumda"],
c:2
},

{
q:"Jismning shakli o'zgartirilsa (hajmi o'zgarmasdan), unga ta'sir qiluvchi Arximed kuchi qanday o'zgaradi?",
a:["Ortadi","Kamayadi","O'zgarmaydi","Nolga tenglashadi"],
c:2
},

{
q:"Suyuqlikka botirilgan jismga Arximed kuchi nima sababdan ta'sir qiladi?",
a:["Suyuqlikning yuqori va pastki qismlaridagi bosimlar farqi tufayli","Ishqalanish tufayli","Elektr zaryadlari tufayli","Massa ortishi tufayli"],
c:0
},

{
q:"Kema daryodan dengizga o'tsa, uning suvga botish chuqurligi (cho'kishi) qanday o'zgaradi?",
a:["Ortadi","Kamayadi (chunki sho'r suv zichligi katta)","O'zgarmaydi","Suvga to'la botib ketadi"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
