<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 28 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Klapeyron tenglamasi
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Mendeleyev-Klapeyron tenglamasining (ideal gaz holat tenglamasi) to'g'ri ifodasini ko'rsating.",
a:["pV = (m/M)RT","pV = const","V/T = const","p = nkT"],
c:0
},

{
q:"Universal gaz doimiysi (R) ning Xalqaro birliklar sistemasi (XBS) dagi birligi nima?",
a:["J/(kg·K)","J·mol/K","J/(K·mol)","Pa·m³/K"],
c:2
},

{
q:"Universal gaz doimiysi (R) ning fizik ma'nosi nima?",
a:["1 mol gazdagi molekulalar soni","1 mol ideal gazni o'zgarmas bosimda 1 K ga isitishda bajarilgan ish","Molekulalarning o'rtacha kinetik energiyasi","Absolut nol temperaturadagi bosim"],
c:1
},

{
q:"Quyidagi formulalarning qaysi biri Klapeyron tenglamasi (birlashtirilgan gaz qonuni) deyiladi?",
a:["pV = const","V/T = const","pV/T = const","p/T = const"],
c:2
},

{
q:"Universal gaz doimiysi (R) qaysi ikki doimiyning ko'paytmasiga teng (R = k · NA)?",
a:["Bolsman doimiysi va Avogadro doimiysi","Plank doimiysi va zaryad miqdori","Zichlik va hajm","Massa va tezlanish"],
c:0
},

{
q:"Ideal gazning bosimi (p), absolut temperaturasi (T) va molyar massasi (M) ma'lum bo'lsa, uning zichligi (ρ) qaysi formula bilan aniqlanadi?",
a:["ρ = MRT / p","ρ = pM / (RT)","ρ = p / (MRT)","ρ = m/V"],
c:1
},

{
q:"Hajmi va absolut harorati 2 martadan oshirilsa, ideal gazning bosimi qanday o'zgaradi?",
a:["2 marta kamayadi","2 marta ortadi","O'zgarmaydi","4 marta ortadi"],
c:2
},

{
q:"Ideal gazning absolut harorati va hajmi 4 martadan kamaysa, uning bosimi qanday o'zgaradi?",
a:["O'zgarmaydi","4 marta ortadi","16 marta kamayadi","2 marta ortadi"],
c:0
},

{
q:"Modda miqdori (ν) qanday topiladi?",
a:["ν = m/M","ν = N/NA","Ikkala javob ham to'g'ri","ν = pV"],
c:2
},

{
q:"Universal gaz doimiysi (R) ning qiymati qanchaga teng?",
a:["1,38 · 10⁻²³ J/K","6,02 · 10²³ mol⁻¹","8,31 J/(mol·K)","1,6 · 10⁻¹⁹ C"],
c:2
},

{
q:"Ideal gaz bosimi p = nkT ifodasidagi 'n' nimani anglatadi?",
a:["Modda miqdori","Molekulalar konsentratsiyasi (hajm birligidagi zarralar soni)","Gaz massasi","Neytronlar soni"],
c:1
},

{
q:"V hajmli idishdagi molekulalar konsentratsiyasi n bo'lsa, idishda necha mol (ν) gaz bor?",
a:["ν = V·NA / n","ν = nV / NA","ν = nV / R","ν = n/V"],
c:1
},

{
q:"O'zgarmas bosimda (p = const) gazning zichligi temperatura (T) ga qanday bog'liq?",
a:["To'g'ri proporsional","Teskari proporsional (ρ ∝ 1/T)","Bog'liq emas","Kvadratik bog'liq"],
c:1
},

{
q:"1 mol miqdordagi bir atomli ideal gazning ichki energiyasi (U) qaysi formula bilan aniqlanadi?",
a:["U = 3/2 kT","U = 3/2 RT","U = 3/2 NA","U = pV"],
c:1
},

{
q:"Hajmi 8,31 litr bo'lgan 1 mol gazning 27°C (300 K) haroratdagi bosimi necha Pa bo'ladi? (R = 8,31)",
a:["2 · 10⁵ Pa","3 · 10⁵ Pa","4 · 10⁵ Pa","10⁵ Pa"],
c:1
},

{
q:"Mendeleyev-Klapeyron tenglamasiga ko'ra, gazning massasi (m) qanday topiladi?",
a:["m = pVM / (RT)","m = pV / (MRT)","m = RT / (pVM)","m = n·M"],
c:0
},

{
q:"Normal sharoitda (T = 273,15 K, p = 10⁵ Pa) har qanday ideal gazning 1 moli qancha hajm egallaydi (V₀)?",
a:["1 m³","22,4 litr (22,4 · 10⁻³ m³)","10 litr","100 litr"],
c:1
},

{
q:"Ideal gaz pV diagrammadagi qaysi nuqtaga mos holatda eng katta ichki energiyaga ega bo'ladi (U ∝ pV)?",
a:["Bosim va hajm ko'paytmasi (pV) eng kichik bo'lgan nuqtada","Bosim va hajm ko'paytmasi (pV) eng katta bo'lgan nuqtada","Faqat bosim katta bo'lgan nuqtada","Faqat hajm katta bo'lgan nuqtada"],
c:1
},

{
q:"Idishdagi gazlar aralashmasining umumiy bosimi parsial bosimlar yig'indisiga tengligi qaysi qonun?",
a:["Paskal qonuni","Dalton qonuni","Shar qonuni","Guk qonuni"],
c:1
},

{
q:"Gaz bosimini ifodalovchi p = 2/3 nEk munosabatidagi Ek nimani anglatadi?",
a:["Molekulalarning potensial energiyasi","Molekulalarning o'rtacha kinetik energiyasi","Gazning to'la energiyasi","Tashqi kuchlar bajargan ish"],
c:1
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
