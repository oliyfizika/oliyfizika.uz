<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mavzu 26 Quiz | OliyFizika.uz</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Ideal gaz
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Gazni **ideal** deb hisoblash uchun quyidagilarning qaysi biri hisobga olinmaydi?",
a:["Molekulalarning massasi","Molekulalarning o'zaro to'qnashuvi","Molekulalarning masofadan turib o'zaro ta'sirlashishi","Molekulalarning xaotik harakati"],
c:2
},

{
q:"Ideal gaz **bosimi** nima sababli yuzaga keladi?",
a:["Molekulalarning o'zaro tortilishi tufayli","Molekulalarning idish devorlariga kelib urilishi natijasida","Gazning og'irligi tufayli","Hajm o'zgarishi natijasida"],
c:1
},

{
q:"**Mendeleev-Klapeyron** tenglamasining (ideal gaz holat tenglamasi) to'g'ri ifodasini ko'rsating.",
a:["PV = nkT","PV = (m/μ)RT","P = 2/3 nEk","V/T = const"],
c:1
},

{
q:"**Absolut temperatura** (T) molekulalarning qaysi parametrini xarakterlaydi?",
a:["Molekulalar sonini","Molekulalarning o'lchamini","Molekulalar ilgarilanma harakati o'rtacha kinetik energiyasini","Gaz zichligini"],
c:2
},

{
q:"O'zgarmas massali gazda **izoxorik jarayon** (V = const) uchun qaysi qonun o'rinli?",
a:["P/T = const (Sharl qonuni)","PV = const (Boyl-Mariott qonuni)","V/T = const (Gey-Lussak qonuni)","P/V = const"],
c:0
},

{
q:"**Universal gaz doimiysi** (R) ning fizik ma'nosi nima?",
a:["1 mol gazdagi molekulalar soni","1 mol ideal gazni o'zgarmas bosimda 1 K ga isitishda bajarilgan ish","Molekulalarning o'rtacha tezligi","Absolut nol temperaturadagi bosim"],
c:1
},

{
q:"**Bolsman doimiysi** (k) ning qiymati qanchaga teng?",
a:["$8,31 \\text{ J/(mol·K)}$","$6,02 \\cdot 10^{23} \\text{ mol}^{-1}$","$1,38 \\cdot 10^{-23} \\text{ J/K}$","$1,6 \\cdot 10^{-19} \\text{ C}$"],
c:2
},

{
q:"**Izotermik jarayonda** (T = const) gaz bosimi 2 marta ortsa, uning hajmi qanday o'zgaradi?",
a:["2 marta ortadi","O'zgarmaydi","2 marta kamayadi (teskari proporsional)","4 marta kamayadi"],
c:2
},

{
q:"**Absolut nol temperatura** (0 K) da molekulalarning qaysi harakati to'xtaydi?",
a:["Barcha turdagi harakatlar","Faqat aylanma harakati","Faqat ilgarilanma harakati","Faqat tebranma harakati"],
c:2
},

{
q:"Gaz molekulalarining **o'rtacha kvadratik tezligi** (v) absolut harorat (T) ga qanday bog'liq?",
a:["T ga to'g'ri proporsional","T ning kvadrat ildiziga ($v \\propto \\sqrt{T}$)","T ga teskari proporsional","Bog'liq emas"],
c:1
},

{
q:"Qaysi termodinamik jarayonda ideal gaz **tashqi kuchlar ustidan ish bajarmaydi**?",
a:["Izobarik jarayonda","Izotermik jarayonda","Izoxorik jarayonda (V = const)","Adiabatik jarayonda"],
c:2
},

{
q:"Idishdagi gazlar aralashmasining umumiy bosimi parsial bosimlar yig'indisiga tengligi qaysi qonun?",
a:["Paskal qonuni","Dalton qonuni","Shar qonuni","Guk qonuni"],
c:1
},

{
q:"Bir atomli ideal gazning **ichki energiyasi** (U) qaysi formula bilan aniqlanadi?",
a:["U = 1/2 m v²","U = 3/2 (m/μ) RT","U = mgh","U = PV/T"],
c:1
},

{
q:"O'zgarmas bosimda (P = const) kechadigan **izobarik jarayon** qaysi olim nomi bilan bog'liq?",
a:["Boyl-Mariott","Sharl","Gey-Lussak","Klapeyron"],
c:2
},

{
q:"Molekulyar-kinetik nazariyaning (MKN) **asosiy tenglamasini** ko'rsating.",
a:["P = n k T","P = 1/3 n m₀ v² (yoki P = 2/3 n Ek)","PV = const","V/T = const"],
c:1
},

{
q:"Qaysi jarayonda gazga berilgan **issiqlik miqdori** (Q) to'laligicha uning ichki energiyasini oshirishga sarflanadi?",
a:["Izobarik","Izotermik","Izoxorik ($Q = \\Delta U$)","Adiabatik"],
c:2
},

{
q:"**Normal sharoitda** (T=273,15 K, P=10⁵ Pa) 1 mol ideal gaz qancha hajm (V₀) egallaydi?",
a:["1 m³","$22,4 \\cdot 10^{-3} \\text{ m}^3$ (22,4 litr)","10 litr","100 litr"],
c:1
},

{
q:"Ideal gazning **zichligi** ($\rho$) uning bosimi (P) va temperaturasiga (T) qanday bog'langan?",
a:["$\\rho = \\mu RT / P$","$\\rho = \\mu P / (RT)$","$\\rho = P / (\\mu T)$","$\\rho = m/V$ ga bog'liq emas"],
c:1
},

{
q:"**Loshtmid soni** (yoki normal konsentratsiya) nimani ifodalaydi?",
a:["1 kg moddadagi molekulalar sonini","Normal sharoitda 1 m³ gazdagi molekulalar sonini","1 mol modda hajmini","Yorug'lik tezligini"],
c:1
},

{
q:"Ideal gaz **izobarik kengayganda** uning ichki energiyasi qanday o'zgaradi?",
a:["Kamayadi","O'zgarmaydi","Ortadi (chunki T ortadi)","Nolga tenglashadi"],
c:2
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
