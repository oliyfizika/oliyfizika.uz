<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#020817,#07122f,#020817);
display:flex;
justify-content:center;
align-items:center;
padding:20px;
color:white;
}

.quiz-box{

width:100%;
max-width:900px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:35px;
}

h1{

text-align:center;

margin-bottom:20px;
}

.progress{

height:12px;

background:rgba(255,255,255,.08);

border-radius:20px;

overflow:hidden;

margin-bottom:20px;
}

.progress-bar{

height:100%;

width:0%;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

transition:.3s;
}

.timer{

text-align:center;

font-size:26px;

font-weight:700;

margin-bottom:20px;

color:#38bdf8;
}

.question{

font-size:24px;

font-weight:600;

margin-bottom:25px;

line-height:1.6;
}

.answers{

display:grid;

gap:15px;
}

.answer{

padding:18px;

border-radius:18px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

cursor:pointer;

transition:.3s;
}

.answer:hover{

border-color:#38bdf8;
}

.correct{

background:#16a34a !important;
}

.wrong{

background:#dc2626 !important;
}

.next-btn{

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

font-weight:600;

cursor:pointer;

display:none;
}

.result{

display:none;

text-align:center;
}

.result h2{

font-size:42px;

margin-bottom:25px;
}

.result p{

font-size:22px;

line-height:2;
}

.restart{

margin-top:20px;

padding:16px 30px;

border:none;

border-radius:16px;

background:
linear-gradient(135deg,#2563eb,#38bdf8);

color:white;

font-size:18px;

cursor:pointer;
}

.back-to-quizs{

display:inline-block;

margin-top:15px;

margin-left:10px;

padding:16px 30px;

border-radius:16px;

text-decoration:none;

color:white;

font-size:18px;

font-weight:600;

background:
linear-gradient(135deg,#0f766e,#14b8a6);

transition:.3s;

}

.back-to-quizs:hover{

transform:translateY(-3px);

}

#background-texts{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
pointer-events:none;
}

.floating-text{
position:absolute;
font-size:28px;
font-weight:700;
color:rgba(255,255,255,0.06);
white-space:nowrap;
user-select:none;
}

</style>
</head>

<body>

<div id="background-texts"></div>

<div class="quiz-box">

<h1>
    QUIZ:
ðŸš€ Qattiq jismlar
</h1>

<div class="progress">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="timer"
id="timer">

15

</div>

<div id="quizArea">

<div
class="question"
id="question">

</div>

<div
class="answers"
id="answers">

</div>

<button
class="next-btn"
id="nextBtn">

Keyingi savol

</button>

</div>

<div
class="result"
id="result">

<h2>
🎉 Quiz yakunlandi
</h2>

<p id="resultText"></p>

<button
class="restart"
onclick="location.reload()">

🔄 Qayta ishlash

</button>

<a
href="quizs.html"
class="back-to-quizs">

📚 Quizlarga qaytish

</a>

</div>

</div>

<script>


const questions = [

{
q:"Kristall qattiq jismlarning erish jarayonida temperaturasi qanday o'zgaradi?",
a:["Doimiy ortib boradi","Kamayadi","O'zgarmaydi","Dastlab ortib, keyin kamayadi"],
c:2
},

{
q:"Amorf qattiq jismlarning erish jarayonida harorat qanday o'zgaradi?",
a:["O'zgarmaydi","Ortib boradi","Kamayadi","Nolga tenglashadi"],
c:1
},

{
q:"Qattiq jism fizik xossalarining (masalan, issiqlik o'tkazuvchanlik, elektr o'tkazuvchanlik) turli yo'nalishlarda turlicha bo'lishi nima deyiladi?",
a:["Izotroplik","Anizotroplik","Diffuziya","Sublimatsiya"],
c:1
},

{
q:"Har qanday monokristall quyidagi xossalardan qaysi biriga albatta ega bo'ladi?",
a:["Izotroplik","Anizotroplik","Shaffoflik","Suyuqlik xossasi"],
c:1
},

{
q:"Amorf moddalar uchun quyidagi xususiyatlardan qaysi biri xos?",
a:["Anizotroplik","Aniq erish haroratiga ega emaslik (yumshash)","Qat'iy kristall panjaraga egalik","Faqat past haroratda mavjudlik"],
c:1
},

{
q:"Mexanik kuchlanish ($\sigma$) qaysi formula bilan aniqlanadi? ($F$ – elastiklik kuchi, $S$ – ko'ndalang kesim yuzasi)",
a:["σ = F·S","σ = F/S","σ = E/ε","σ = Δl/l"],
c:1
},

{
q:"Nisbiy deformatsiya ($\epsilon$) formulasini ko'rsating.",
a:["ε = l/Δl","ε = Δl/l₀","ε = σ/E","Ikkala (B va C) javob ham to'g'ri"],
c:3
},

{
q:"Guk qonunining mexanik kuchlanish orqali ifodasini ko'rsating.",
a:["σ = E·ε","σ = F/S","F = -kx","σ = E/ε"],
c:0
},

{
q:"Yung moduli ($E$) qanday birlikda o'lchanadi?",
a:["N/m","N·m","Paskal (Pa)","Joul (J)"],
c:2
},

{
q:"Sterjenning uzunligi 3 marta orttirilsa, uning bikrligi ($k$) qanday o'zgaradi?",
a:["3 marta ortadi","3 marta kamayadi","9 marta kamayadi","O'zgarmaydi"],
c:1
},

{
q:"Sterjenning ko'ndalang kesim yuzi 4 marta ortsa, uning bikrligi qanday o'zgaradi?",
a:["4 marta ortadi","4 marta kamayadi","2 marta ortadi","O'zgarmaydi"],
c:0
},

{
q:"Cho'zilish diagrammasining qaysi qismida Guk qonuni bajariladi (proportsionallik chegarasi)?",
a:["Diagrammaning egilgan qismida","Diagrammaning chiziqli (to'g'ri) qismida","Faqat uzilish nuqtasida","O'zgarmas kuchlanish sohasida"],
c:1
},

{
q:"Mustahkamlik chegarasi $\sigma$ va zichligi $\rho$ bo'lgan sim o'z og'irligi ta'sirida uzilib ketmasligi uchun uning maksimal uzunligi ($L$) qanday bo'lishi kerak?",
a:["L = σ·ρ·g","L = σ/(ρ·g)","L = ρ·g/σ","L = σ/ρ"],
c:1
},

{
q:"Polikristall jismlar (masalan, metallar) makroskopik jihatdan qanday xossaga ega?",
a:["Anizotrop","Izotrop (chunki mayda kristallchalar tartibsiz joylashgan)","Faqat shaffof","Suyuqlik kabi oqadi"],
c:1
},

{
q:"Deformatsiya to'xtatilgandan keyin jism o'z shaklini to'la tiklasa, bunday deformatsiya qanday ataladi?",
a:["Plastik deformatsiya","Elastik deformatsiya","Qoldiq deformatsiya","Mo'rt deformatsiya"],
c:1
},

{
q:"Tashqi kuch ta'siri to'xtagandan keyin jism o'z shaklini tiklamasa (qoldiq deformatsiya qolsa), bu qanday deformatsiya?",
a:["Elastik","Plastik","Garmonik","Izotermik"],
c:1
},

{
q:"Yung moduli ($E$) nimani xarakterlaydi?",
a:["Jismning og'irligini","Moddaning elastik xossalarini","Jismning hajmini","Atmosfera bosimini"],
c:1
},

{
q:"Metall jism yuqori haroratgacha qizitilsa, uning zichligi va hajmi qanday o'zgaradi?",
a:["Hajmi ortadi, zichligi kamayadi","Ikkalasi ham ortadi","Hajmi kamayadi, zichligi ortadi","O'zgarmaydi"],
c:0
},

{
q:"Simning nisbiy uzayishi 2% ga teng. Agar Yung moduli $200 \text{ GPa}$ bo'lsa, mexanik kuchlanishni toping.",
a:["4 GPa","400 MPa","4000 Pa","40 GPa"],
c:1
},

{
q:"Cho'zilish diagrammasida materialning uzilishidan oldingi eng katta kuchlanish nima deyiladi?",
a:["Oquvchanlik chegarasi","Proportsionallik chegarasi","Mustahkamlik chegarasi","Elastiklik chegarasi"],
c:2
}

];

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(
Math.random()*(i+1)
);

[array[i],array[j]]=
[array[j],array[i]];

}

return array;

}

shuffleArray(questions);

let current = 0;
let score = 0;
let wrong = 0;
let timeout = 0;

let timer;
let timeLeft = 15;

const question =
document.getElementById("question");

const answers =
document.getElementById("answers");

const nextBtn =
document.getElementById("nextBtn");

function loadQuestion(){

clearInterval(timer);

timeLeft = 15;

document.getElementById("timer")
.innerHTML = "⏱ " + timeLeft;

const q = questions[current];

question.innerHTML =
(current+1)+". "+q.q;

answers.innerHTML = "";

let shuffledAnswers =
q.a.map((answer,index)=>({

text:answer,

correct:index===q.c

}));

shuffleArray(shuffledAnswers);

shuffledAnswers.forEach((item)=>{

const div =
document.createElement("div");

div.className="answer";

div.innerHTML=item.text;

div.onclick=()=>selectAnswer(
item.correct,
div
);

answers.appendChild(div);

});

document.getElementById("progressBar")
.style.width =
(current/questions.length)*100 + "%";

startTimer();

}

function startTimer(){

timer=setInterval(()=>{

timeLeft--;

document.getElementById("timer")
.innerHTML="⏱ "+timeLeft;

if(timeLeft<=0){

clearInterval(timer);

timeout++;

nextQuestion();

}

},1000);

}

function selectAnswer(

isCorrect,

selectedBtn

){

clearInterval(timer);

const all =
document.querySelectorAll(".answer");

all.forEach(a=>
a.style.pointerEvents="none");

if(isCorrect){

selectedBtn
.classList.add("correct");

score++;

}else{

selectedBtn
.classList.add("wrong");

wrong++;

all.forEach(btn=>{

const text =
btn.innerText;

const q =
questions[current];

if(text===q.a[q.c]){

btn.classList.add(
"correct"
);

}

});

}

nextBtn.style.display="block";

}

nextBtn.onclick=()=>{

nextQuestion();

};

function nextQuestion(){

current++;

if(current<questions.length){

nextBtn.style.display="none";

loadQuestion();

}else{

showResult();

}

}

function showResult(){

clearInterval(timer);

document.getElementById("quizArea")
.style.display="none";

document.getElementById("timer")
.style.display="none";

document.getElementById("result")
.style.display="block";

const percent =
(score/questions.length)*100;

document.getElementById("resultText")
.innerHTML=

`
✅ To'g'ri: ${score}<br>
❌ Noto'g'ri: ${wrong}<br>
⏱ Vaqti tugagan: ${timeout}<br>
📊 Natija: ${percent.toFixed(0)}%
`;

document.getElementById("progressBar")
.style.width="100%";

}

loadQuestion();

const bgContainer =
document.getElementById("background-texts");

const texts = [];

for(let i=0;i<8;i++){

const el =
document.createElement("div");

el.className = "floating-text";

el.innerText = "OliyFizika.uz";

bgContainer.appendChild(el);

texts.push({
el,
x:Math.random()*(window.innerWidth-200),
y:Math.random()*(window.innerHeight-50),
dx:(Math.random()*2+1)*(Math.random()>0.5?1:-1),
dy:(Math.random()*2+1)*(Math.random()>0.5?1:-1)
});

}

function animateTexts(){

texts.forEach(t=>{

t.x += t.dx;
t.y += t.dy;

const w = t.el.offsetWidth;
const h = t.el.offsetHeight;

if(t.x <= 0 || t.x + w >= window.innerWidth){
t.dx *= -1;
}

if(t.y <= 0 || t.y + h >= window.innerHeight){
t.dy *= -1;
}

t.el.style.transform =
`translate(${t.x}px, ${t.y}px)`;

});

requestAnimationFrame(animateTexts);
}

animateTexts();

</script>

</body>
</html>
