<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Hunt | OliyFizika.uz</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.quiz-container{
    width:100%;
    max-width:800px;
    background:rgba(255,255,255,.08);
    border-radius:20px;
    padding:30px;
    backdrop-filter:blur(10px);
}

.header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-weight:bold;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

#question{
    font-size:1.3rem;
    margin-bottom:20px;
}

.option{
    width:100%;
    padding:15px;
    margin:10px 0;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.option:hover{
    transform:scale(1.02);
}

.correct{
    background:#16a34a !important;
    color:white;
}

.wrong{
    background:#dc2626 !important;
    color:white;
}

.default{
    background:white;
    color:#111827;
}

#nextBtn{
    margin-top:20px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    display:none;
}

.result{
    text-align:center;
    display:none;
}

.result h1{
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    margin:10px;
    padding:12px 20px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    background:#2563eb;
}
</style>
</head>

<body>

<div class="quiz-container">

    <div id="quizBox">

        <div class="header">
            <span id="progress">1 / 10</span>
            <span id="score">Ball: 0</span>
        </div>

        <h2>🎯 Formula Hunt</h2>

        <div id="question"></div>

        <div id="options"></div>

        <button id="nextBtn">Keyingi savol</button>

    </div>

    <div class="result" id="resultBox">

        <h1>🏆 O'yin tugadi!</h1>

        <h2 id="finalScore"></h2>

        <h3 id="bestScore"></h3>

        <button class="btn" onclick="location.reload()">
            🔄 Qayta o'ynash
        </button>

        <a href="interaktiv-oyinlar.html" class="btn">
            ⬅ O'yinlarga qaytish
        </a>

    </div>

</div>

<script src="formula-hunt.js"></script>

</body>
</html>
