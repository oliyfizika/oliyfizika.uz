<!DOCTYPE html>

<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arqon Tortish | OliyFizika.uz</title>

<link rel="stylesheet" href="arqon-tortish.css">

</head>
<body>

<h1 class="title">
ARQON TORTISH: FIZIKA
</h1>

<div class="game-container">


<!-- CHAP PANEL -->

<div class="player-panel">

    <div class="panel-header blue">
        Birinchi jamoa
        <span id="score1" class="score-circle">0</span>
    </div>

    <div id="question" class="question-box blue-question">
    Savol yuklanmoqda...
    </div>

    <div id="player1-options" class="answers">
    </div>

</div>

<!-- ARENA -->

<div class="arena">

    <div class="scoreboard">

        <div>
            Birinchi jamoa
            <div class="score-number">0</div>
        </div>

        <div class="timer" id="timer">
            ⏱ 10
        </div>

        <div>
            Ikkinchi jamoa
            <div class="score-number">0</div>
        </div>

    </div>

    <div class="battlefield">

        <div class="center-line"></div>
        <div id="tugContainer">

            <img
            src="assets/tug-war.png"
            alt="Arqon tortish"
            class="tug-image">

        </div>

    </div>

    <div id="winner"></div>

</div>

<!-- O'NG PANEL -->

<div class="player-panel">

    <div class="panel-header red">
        Ikkinchi jamoa
        <span id="score2" class="score-circle">0</span>
    </div>

    <div id="question2" class="question-box red-question">
        Savol yuklanmoqda...
    </div>

    <div id="player2-options" class="answers">
    </div>

</div>


</div>

<script src="arqon-tortish.js"></script>

</body>
</html>
