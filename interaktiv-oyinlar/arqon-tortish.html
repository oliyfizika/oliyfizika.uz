*{

    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,.08);
    padding:30px;
    border-radius:20px;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.players{
    display:flex;
    justify-content:space-between;
    font-size:24px;
    margin-bottom:15px;
}

.rope-game{
    display:flex;
    align-items:center;
    gap:20px;
    margin:30px 0;
}

.player-left,
.player-right{
    font-size:60px;
    user-select:none;
}

.rope-container{
    flex:1;
}

.rope-container{
    margin:30px 0;
}

.rope{
    width:100%;
    height:16px;
    background:#d4a373;
    border-radius:20px;
    position:relative;
}

.flag{
    position:absolute;
    top:-15px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    transition:.4s;
}

#turn{
    text-align:center;
    font-size:20px;
    margin-bottom:20px;
}

#question{
    font-size:22px;
    margin-bottom:20px;
    text-align:center;
}

.options{
    display:grid;
    gap:12px;
}

.option{
    padding:15px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.option:hover{
    transform:scale(1.02);
}

.correct{
    background:#16a34a;
    color:white;
}

.wrong{
    background:#dc2626;
    color:white;
}

#result{
    text-align:center;
    font-size:28px;
    margin-top:25px;
    display:none;
}

#restart{
    display:none;
    margin:20px auto 0;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.player{
    width:48%;
}

.player h2{
    text-align:center;
    margin-bottom:15px;
}

#player1-options,
#player2-options{
    display:grid;
    gap:12px;
}

let currentQuestion = 0;
let position = 0;

const flag = document.getElementById("flag");
const questionEl = document.getElementById("question");
const resultEl = document.getElementById("result");

const player1Options =
document.getElementById("player1-options");

const player2Options =
document.getElementById("player2-options");

function updateFlag(){
    flag.style.left = `${50 + position*8}%`;
}


function shuffleArray(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];
    }

    return array;
}

shuffleArray(questions);

function loadQuestion(){

    const originalQuestion =
    questions[currentQuestion % questions.length];

    const options =
    [...originalQuestion.options];

    const correctAnswer =
    options[originalQuestion.answer];

    shuffleArray(options);

    const newAnswerIndex =
    options.indexOf(correctAnswer);

    const q = {
        question: originalQuestion.question,
        options: options,
        answer: newAnswerIndex
    };

    questionEl.textContent = q.question;

    player1Options.innerHTML = "";
    player2Options.innerHTML = "";

    q.options.forEach((option,index)=>{

        const btn1 = document.createElement("button");
        btn1.className = "option";
        btn1.textContent = option;
        btn1.onclick = ()=>checkAnswer(1,index,q);

        const btn2 = document.createElement("button");
        btn2.className = "option";
        btn2.textContent = option;
        btn2.onclick = ()=>checkAnswer(2,index,q);

        player1Options.appendChild(btn1);
        player2Options.appendChild(btn2);

    });

    window.currentDisplayedQuestion = q;
}

function checkAnswer(player,selected){

    const q = window.currentDisplayedQuestion;

    if(selected !== q.answer){
        return;
    }

    if(player === 1){
        position--;
    }else{
        position++;
    }

    updateFlag();

    if(position <= -5){
        finishGame("🏆 O'quvchi 1 g'olib!");
        return;
    }

    if(position >= 5){
        finishGame("🏆 O'quvchi 2 g'olib!");
        return;
    }

    currentQuestion++;

    loadQuestion();
}

function finishGame(text){

    questionEl.style.display = "none";

    player1Options.style.display = "none";
    player2Options.style.display = "none";

    resultEl.style.display = "block";
    resultEl.textContent = text;

    document.getElementById("restart")
    .style.display = "block";
}

loadQuestion();
