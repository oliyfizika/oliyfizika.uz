<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sozlamalar | OliyFizika.uz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<main class="dashboard-shell">

<nav class="dashboard-nav">
<a class="logo" href="../index.html">Oliy<span>Fizika</span>.uz</a>

<div class="nav-links">
<a class="btn" href="../index.html">Bosh sahifa</a>
<a class="btn btn-primary" href="profile.html">Profil</a>
</div>
</nav>

<header class="page-header">
<h1>Sozlamalar</h1>
<p>Ism-familiya va telefon raqamingizni yangilang. Email xavfsizlik sababli bu sahifada o'zgartirilmaydi.</p>
</header>

<section class="panel">
<form class="settings-form" id="settingsForm" novalidate>

<div class="form-field">
<label for="settingsFullName">Full Name</label>
<input type="text" id="settingsFullName" autocomplete="name" required>
</div>

<div class="form-field">
<label for="settingsPhone">Phone</label>
<input type="tel" id="settingsPhone" autocomplete="tel" required>
</div>

<div class="form-field">
<label for="settingsEmail">Email</label>
<input type="email" id="settingsEmail" readonly>
</div>

<div class="form-actions">
<button type="submit" class="btn btn-primary" id="settingsSubmit">Saqlash</button>
<span class="status" id="settingsStatus" role="status" aria-live="polite"></span>
</div>

</form>
</section>

</main>

<script type="module" src="../js/settings-page.js"></script>

</body>
</html>
