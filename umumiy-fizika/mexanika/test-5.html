<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Mavzu Testi | OliyFizika.uz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#020817;
  color:white;
  padding:36px 20px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%),
    linear-gradient(135deg,#020817,#07122f,#020817);
  z-index:-1;
}

.quiz-container{
  width:100%;
  max-width:1020px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:36px;
}

.back-link{
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

h1{
  font-size:44px;
  line-height:1.2;
}

.subtitle{
  color:#cbd5e1;
  margin-top:10px;
}

.question{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  padding:28px;
  border-radius:24px;
  margin-bottom:24px;
}

.question h2{
  margin-bottom:18px;
  font-size:22px;
  line-height:1.6;
}

.graph-box{
  margin:4px 0 20px;
  padding:18px;
  border-radius:18px;
  background: white;
  border:1px solid rgba(148,163,184,.24);
  overflow-x:auto;
}

.graph-box img{
  width:100%;
  max-width:300px;
  display:block;
  margin:auto;
}

.answers{
  display:grid;
  gap:12px;
}

.answer-option{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:15px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid transparent;
  cursor:pointer;
  transition:.2s;
}

.answer-option:hover{
  background:rgba(37,99,235,.22);
}

.answer-option.correct{
  border-color:#22c55e;
  background:rgba(34,197,94,.18);
}

.answer-option.wrong{
  border-color:#ef4444;
  background:rgba(239,68,68,.18);
}

.submit-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.result{
  margin-top:28px;
  padding:22px;
  border-radius:20px;
  text-align:center;
  font-size:24px;
  font-weight:700;
  background:rgba(255,255,255,.05);
}

.result:empty{
  display:none;
}

.result.success{
  color:#86efac;
}

.result.error{
  color:#fca5a5;
}

@media(max-width:720px){
  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<main class="quiz-container">

<div class="topbar">
  <div>
    <h1>5-Mavzu | Tekis o‘zgaruvchan harakatda ko‘chish</h1>m
    <p class="subtitle">Kamida 80% natija 6-darsni ochadi.</p>
  </div>

  <a href="mexanika.html" class="back-link">Orqaga</a>
</div>

<div id="questions"></div>

<button
type="button"
class="submit-btn"
id="submitBtn">
Testni yakunlash
</button>

<div class="result" id="result"></div>

</main>

<script type="module">

import { renderMultipleChoiceTest }
from "../../js/multiple-choice-test.js";


const questions = [
{
  text:"Jism tekis tezlanuvchan harakatlanib, 6 s davomida o‘z tezligini 0,1 m/s dan 0,4 m/s gacha oshirdi. Jism necha m/s² tezlanish bilan harakatlangan?",
  answers:["5","0,5","0,05","0,005"],
  correct:2
},

{
  text:"To‘g‘ri chiziqli tekis sekinlanuvchan harakatda tezlanish vektori ...",
  answers:[
    "moduli o‘zgarmaydi va  yo‘nalishi doimiy o‘zgarib turadi",
    "moduli va yo‘nalishi o‘zgarib turadi",
    "a > 0 holda moduli va yo‘nalishi o‘zgarmaydi",
    "a < 0 holda moduli va yo‘nalishi o‘zgarmaydi"
  ],
  correct:3
},

{
  text:"Tekis o‘zgaruvchan harakatdagi oniy tezlikni hisoblash uchun nima berilishi lozim?",
  answers:[
    "harakatning boshlang‘ich tezligi va tezlanishi",
    "tezlanish va harakatlanish vaqti",
    "boshlang‘ich tezlik va tezlanishning moduli",
    "tezlanish, harakatlanish vaqti va boshlang‘ich tezlik"
  ],
  correct:3
},

{
  text:"Agar avtomobilning boshlang‘ich tezligi 36 km/h bo‘lib, 1 minutdan so‘ng to‘xtasa, tormozlanish jarayonida tezlikning vaqtga bog‘lanish tenglamasi qanday bo‘ladi?",
  answers:[
    "v = 10 − 20t",
    "v = 10 − 0,17t",
    "v = 36 − 36t",
    "v = 36 + 36t"
  ],
  correct:1
},

{
  text:"Jism v₀ boshlang‘ich tezlik va a tezlanish bilan tekis sekinlanuvchan harakat qilmoqda. Jismning tezligi qancha vaqtdan so‘ng 2 marta kamayadi?",
  answers:[
    "v₀/a",
    "2v₀/a",
    "v₀/3a",
    "v₀/2a"
  ],
  correct:3
},

{
  text:"Jism tinch holatdan harakatga kelib, t vaqtda 2a tezlanish bilan, so‘ngra 4t vaqtda tekis harakat qildi. Oxirida yana 2t vaqtda a tezlanish bilan harakat qildi. Jismning oxirgi tezligini toping.",
  answers:[
    "−at",
    "at",
    "4at",
    "0"
  ],
  correct:2
},

{
  text:"20 m/s tezlik bilan ketayotgan avtomobil tormozlanish natijasida 2 s da to‘xtadi. Avtomobilning tormozlanish yo‘lini aniqlang (m).",
  answers:[
    "20",
    "150",
    "100",
    "50"
  ],
  correct:0
},

{
  text:"Boshlang‘ich tezlik bilan to‘g‘ri chiziqli tekis tezlanuvchan harakat qilayotgan jismning boshlang‘ich tezligi va tezlanishi 3 marta oshirilsa, uning birlik vaqt ichidagi ko‘chishi necha marta ortadi?",
  answers:[
    "1,5",
    "4,5",
    "3",
    "6"
  ],
  correct:2
},

{
  text: "Quyidagi tenglamalarning qaysilari tekis harakatga taalluqli?  1) s = 2t; 2) s = at²; 3) x = 3t + 2; 4) v = 4 + t; 5) v = 5",
  answers:[
    "2,3,4",
    "1,2,3",
    "1,3,5",
    "3,4,5"
  ],
  correct:2
},

{
  text:"Moddiy nuqta tezligining vaqt bo‘yicha o‘zgarish qonuni v = 4t ko‘rinishga ega. Uning 5 sekundda o‘tgan yo‘li qanday (m)?",
  answers:[
    "32",
    "16",
    "18",
    "50"
  ],
  correct:3
},

{
  text:"Boshlang‘ich tezliksiz tekis tezlanuvchan harakatlanayotgan jism harakatning 5-sekundida 27 m yo‘l bosgan bo‘lsa, uning tezlanishi qanday (m/s²)?",
  answers:[
    "3,5",
    "5,4",
    "6",
    "9"
  ],
  correct:2
},

{
  text:"Reaktiv samolyotga yerda 640 m uzunlikdagi uchish yo‘li talab qilinadi. Uning motorlari unga 5 m/s² tezlanish bera oladi. Samolyot faqat o‘z motorlari yordamida tezligi 72 km/h bo‘lgan aviatashuvchi kemadan uchishi uchun kema palubasining uzunligi minimal qanday bo‘lishi kerak?",
  answers:[
    "64",
    "360",
    "400",
    "480"
  ],
  correct:1
},

{
  text:"Jism harakatni boshlab, harakat vaqtining boshlang‘ich 1/3 qismida tekis tezlanuvchan, so‘ngra tekis va oxirgi 1/4 qismida tekis sekinlanuvchan harakatlanib to‘xtadi. Bu harakatda jismning o‘rtacha tezligi 17 m/s ga teng bo‘lgan bo‘lsa, jism tezligining eng katta qiymati qanday (m/s)?",
  answers:[
    "24",
    "20",
    "34",
    "51"
  ],
  correct:2
},

{
  text:"Jismning harakat tenglamasi x = 3 + 8t − t² ko‘rinishga ega. Jism tezligi nolga teng bo‘lguncha qanday yo‘l o‘tadi (m)?",
  answers:[
    "3",
    "8",
    "16",
    "19"
  ],
  correct:2
},

{
  text:"Moddiy nuqtaning harakat tenglamasi x = 12t − 2t² ko‘rinishga ega. U t = 0 paytdan boshlab, to‘xtaguncha qanday yo‘l bosadi (m)?",
  answers:[
    "12",
    "18",
    "16",
    "32"
  ],
  correct:1
}
];

renderMultipleChoiceTest({
  questions,
  form: document.getElementById("questions"),
  result: document.getElementById("result"),
  submitButton: document.getElementById("submitBtn"),
  unlockLesson: 5
});

</script>

</body>
</html>
