<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3-Mavzu Testi | OliyFizika.uz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  background:#020817;
  color:white;
  padding:36px 20px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left,#0f3b91 0%,transparent 35%),
    radial-gradient(circle at bottom right,#0d1b52 0%,transparent 40%),
    linear-gradient(135deg,#020817,#07122f,#020817);
  z-index:-1;
}

.quiz-container{
  width:100%;
  max-width:1020px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:36px;
}

.back-link{
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
}

h1{
  font-size:44px;
  line-height:1.2;
}

.subtitle{
  color:#cbd5e1;
  margin-top:10px;
}

.question{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);
  padding:28px;
  border-radius:24px;
  margin-bottom:24px;
}

.question h2{
  margin-bottom:18px;
  font-size:22px;
  line-height:1.6;
}

.graph-box{
  margin:4px 0 20px;
  padding:18px;
  border-radius:18px;
  background: white;
  border:1px solid rgba(148,163,184,.24);
  overflow-x:auto;
}

.graph-box img{
  width:100%;
  max-width:300px;
  display:block;
  margin:auto;
}

.answers{
  display:grid;
  gap:12px;
}

.answer-option{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:15px;
  border-radius:14px;
  background:rgba(255,255,255,.04);
  border:1px solid transparent;
  cursor:pointer;
  transition:.2s;
}

.answer-option:hover{
  background:rgba(37,99,235,.22);
}

.answer-option.correct{
  border-color:#22c55e;
  background:rgba(34,197,94,.18);
}

.answer-option.wrong{
  border-color:#ef4444;
  background:rgba(239,68,68,.18);
}

.submit-btn{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#2563eb,#38bdf8);
  color:white;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
}

.result{
  margin-top:28px;
  padding:22px;
  border-radius:20px;
  text-align:center;
  font-size:24px;
  font-weight:700;
  background:rgba(255,255,255,.05);
}

.result:empty{
  display:none;
}

.result.success{
  color:#86efac;
}

.result.error{
  color:#fca5a5;
}

@media(max-width:720px){
  .topbar{
    align-items:flex-start;
    flex-direction:column;
  }

  h1{
    font-size:34px;
  }
}
</style>
</head>

<body>

<main class="quiz-container">

<div class="topbar">
  <div>
    <h1>7-Mavzu | Nisbiy harakat</h1>
    <p class="subtitle">Kamida 80% natija 7-darsni ochadi.</p>
  </div>

  <a href="mexanika.html" class="back-link">Orqaga</a>
</div>

<div id="questions"></div>

<button
type="button"
class="submit-btn"
id="submitBtn">
Testni yakunlash
</button>

<div class="result" id="result"></div>

</main>

<script type="module">

import { renderMultipleChoiceTest }
from "../js/multiple-choice-test.js";


const graph12 = `
<img src="rasmlar7/test7-12.png">
`;


const questions = [

{

},
{

},
{
  "text": "Aylanish chastotasi 20 s−1 bo‘lgan disk 1000 marta aylanishi uchun qancha vaqt kerak bo‘ladi?",

},
{

},
{

{

},
{

  "correct": 0
},
{
  "text": "Quyidagilarni qaysi biri 12 · 103 sekund vaqt miqdorini ifodalaydi?",

  "answers": ["0,8", "16", "0,4", "0,2"],

  "answers": ["9 marta kamayadi", "3 marta ortadi", "3 marta kamayadi", "9 marta ortadi"],

  "answers": ["1:2", "1:20", "1:200", "1:400"],

  "answers": ["0", "5", "25", "25√2"],
  "correct": 3
},
{
  "text": "Moddiy nuqta aylana bo‘ylab 6 m/s tezlik bilan tekis aylanmoqda. Davrning to‘rtdan bir qismida moddiy nuqta tezligi o‘zgarishining moduli qanday (m/s)?",
  "answers": ["0", "3", "12", "6√2"],
  "correct": 3
},
{
  "text": "Agar aylanayotgan disk ustidagi radiuslar 1 sm ga farq qiladigan ikki nuqtaning chiziqli tezliklari orasidagi farq 0,314 m/s ga teng bo‘lsa, diskning aylanish chastotasini toping (Hz).",

renderMultipleChoiceTest({
  questions,
  form: document.getElementById("questions"),
  result: document.getElementById("result"),
  submitButton: document.getElementById("submitBtn"),
  unlockLesson: 8
});

</script>

</body>
</html>
